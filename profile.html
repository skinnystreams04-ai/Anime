<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль Пользователя</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

    <style>
        :root {
            --theme-primary: #a6e3a1; 
            --theme-glow: rgba(166, 227, 161, 0.2); 
            --theme-panel-bg-top: #101411;
            --theme-panel-bg-bottom: #080a08;
            --theme-panel-header: #0b0d0a;
            --theme-panel-border: #283325;
        }

        /* БЛОКИРУЕМ ПРОКРУТКУ И ДЕЛАЕМ FLEX-ПРИЛОЖЕНИЕ */
        body { 
            margin: 0; padding: 0; font-family: 'Neucha', cursive, sans-serif; 
            background-color: #0b0d0a; color: #a4b09c; min-width: 1200px; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(var(--user-color-rgb, 166, 227, 161), 0.08) 0%, #0b0d0a 60%);
        }

        /* ШАПКА ФИКСИРУЕТСЯ СВЕРХУ */
        .top-nav { 
            background: #0b0d0a; border-bottom: 2px solid #283325; padding: 15px 40px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; 
            flex-shrink: 0; z-index: 1000;
        }
        .nav-logo { color: #a6e3a1; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .nav-logo:hover { filter: brightness(1.2); text-shadow: 0 0 15px rgba(166, 227, 161, 0.5); }

        /* КНОПКИ В ШАПКЕ */
        .nav-btn { background: rgba(14, 17, 13, 0.6); border: 1px solid #4a5c41; color: #c4d1b8; padding: 8px 16px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .nav-btn:hover { border-color: #a6e3a1; color: #a6e3a1; box-shadow: 0 0 10px rgba(166, 227, 161, 0.2); transform: translateY(-2px); }

        /* ПРОФИЛЬ TWITCH В ШАПКЕ */
        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid rgba(166, 227, 161, 0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-name-top { font-family: 'Neucha', cursive; font-size: 22px; font-weight: bold; letter-spacing: 1px; line-height: 1; }
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        .wallet-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; line-height: 1; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; }
        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-family: 'Neucha', cursive; font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; line-height: 1;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }

        /* ОСНОВНОЙ ЛЕЙАУТ */
        .layout { 
            display: flex; gap: 4vw; align-items: flex-start; padding: 25px 3vw; width: 100%; 
            box-sizing: border-box; max-width: 1920px; margin: 0 auto; 
            flex: 1; overflow: hidden; /* Занимает всё оставшееся место под шапкой */
        }
        
        .col-left { width: 300px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; margin: auto 0; }
        .col-right { width: 350px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; margin: auto 0; }
        .col-center { flex: 1 1 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; width: 100%; height: 100%; }
        
        /* ВНУТРЕННИЙ СКРОЛЛ ТОЛЬКО ДЛЯ СЕТКИ АНИМЕ */
        .col-center .widget-content {
            flex: 1; overflow-y: auto; padding: 10px;
            scrollbar-width: thin; scrollbar-color: var(--user-color, #a6e3a1) transparent;
        }
        .col-center .widget-content::-webkit-scrollbar { width: 8px; }
        .col-center .widget-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 8px; }
        .col-center .widget-content::-webkit-scrollbar-thumb { background: var(--user-color, #a6e3a1); border-radius: 8px; }

        /* ПЕРСОНАЛИЗИРОВАННЫЕ ПАНЕЛИ */
        .widget-base { 
            background: linear-gradient(180deg, var(--theme-panel-bg-top) 0%, var(--theme-panel-bg-bottom) 100%); 
            border: 2px solid rgba(var(--user-color-rgb, 166, 227, 161), 0.3); 
            border-radius: 6px; display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(var(--user-color-rgb, 166, 227, 161), 0.05); 
            overflow: hidden; transition: border-color 0.5s, box-shadow 0.5s;
        }
        .widget-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--theme-panel-header); border-bottom: 2px solid rgba(var(--user-color-rgb, 166, 227, 161), 0.3); flex-shrink: 0; }
        .widget-title { color: var(--user-color, #a6e3a1); font-weight: bold; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(var(--user-color-rgb, 166, 227, 161), 0.4); }

        /* ПРОФИЛЬНАЯ КАРТОЧКА */
        .profile-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0; }
        .avatar-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 15px; }
        .avatar-wrap::before { content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(20px); opacity: 0.3; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .profile-name { font-size: 32px; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; line-height: 1; }
        
        .badges-row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 15px; }
        .role-badge { padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } 
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; } 
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; } 

        /* СТАТИСТИКА ЛЕВОЙ КОЛОНКИ */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .stat-box { background: rgba(0,0,0,0.3); border: 1px solid #283325; padding: 15px 10px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-size: 32px; font-weight: bold; color: #c4d1b8; line-height: 1; margin-bottom: 5px; text-shadow: 2px 2px 4px #000; font-family: 'Neucha', cursive, sans-serif; }
        .stat-label { font-size: 13px; text-transform: uppercase; color: #829c73; font-weight: bold; letter-spacing: 1px; }
        .chart-wrapper { width: 100%; height: 260px; margin-top: 10px; }

        /* СЕТКА ОЦЕНОК */
        .hof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .hof-item { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #4a5c41; cursor: pointer; transition: 0.3s; aspect-ratio: 2/3; text-decoration: none; display: block; }
        .hof-item:hover { transform: translateY(-5px); border-color: var(--theme-primary); box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px var(--theme-glow); }
        .hof-img { width: 100%; height: 100%; object-fit: cover; }
        .hof-score { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); border: 1px solid var(--theme-primary); color: var(--theme-primary); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 16px; box-shadow: 0 0 10px #000; backdrop-filter: blur(4px); font-family: 'Neucha', cursive, sans-serif; }
        .hof-title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%); padding: 20px 10px 10px 10px; color: #fff; font-size: 14px; font-weight: bold; text-align: center; box-sizing: border-box; text-shadow: 1px 1px 3px #000; }

        /* ПРАВАЯ ВСПЛЫВАЮЩАЯ ПАНЕЛЬ */
        .preview-cover { width: 100%; height: 200px; object-fit: cover; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); border-bottom: 2px solid var(--user-color, #a6e3a1); }
        .preview-content { padding: 0 20px 20px 20px; margin-top: -60px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; }
        .preview-title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 2px 2px 5px #000, 0 0 10px var(--user-color, #a6e3a1); text-transform: uppercase; line-height: 1.1; text-align: center; transition: color 0.5s; }
        .preview-score-box { background: rgba(0,0,0,0.5); border: 1px solid var(--user-color, #a6e3a1); border-radius: 8px; padding: 8px; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .preview-score-label { font-size: 12px; color: #a4b09c; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .preview-score-val { font-size: 55px; font-weight: bold; color: #fff; line-height: 1; text-shadow: 2px 2px 4px #000; font-family: 'Neucha', cursive, sans-serif !important; }
        .preview-score-val span { font-size: 20px; color: #c4d1b8; font-family: 'Neucha', cursive, sans-serif !important; text-shadow: none; letter-spacing: normal; }
        .preview-avg-theory { font-size: 18px; color: #c4d1b8; font-weight: bold; text-align: center; margin: 5px 0 10px 0; padding-bottom: 5px; text-shadow: 1px 1px 2px #000; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: 'Neucha', cursive, sans-serif !important; }
        .preview-chart-wrap { width: 100%; height: 180px; margin-top: 0; }
        .preview-crit-row { display: flex; justify-content: space-between; padding: 4px 10px; border-bottom: 1px dashed rgba(255,255,255,0.15); font-size: 15px; color: #c4d1b8; transition: 0.3s; }
        .preview-crit-row span:last-child { font-weight: bold; color: #fff; font-size: 18px; font-family: 'Neucha', cursive, sans-serif !important; }
        .preview-comment { background: rgba(0,0,0,0.4); border-left: 3px solid var(--user-color, #a6e3a1); padding: 12px; border-radius: 0 8px 8px 0; color: #c4d1b8; font-size: 14px; line-height: 1.4; font-style: italic; white-space: pre-wrap; word-break: break-word; }
        .preview-placeholder { padding: 40px 20px; text-align: center; color: #6b7a62; font-size: 18px; display: flex; height: 100%; align-items: center; justify-content: center; }
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0d0a; z-index: 9999; display: flex; justify-content: center; align-items: center; color: #a6e3a1; font-size: 24px; flex-direction: column; }

        /* ЗАЛ СЛАВЫ И ПОИСК */
        .leaderboard-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .leaderboard-box { background: #0b0d0a; border: 2px solid #a6e3a1; border-radius: 12px; width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(166,227,161,0.2); position: relative; }
        .leaderboard-header { padding: 25px 20px; border-bottom: 1px solid #283325; text-align: center; font-size: 26px; font-weight: bold; color: #a6e3a1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(166,227,161,0.5); flex-shrink: 0; font-family: 'Neucha', cursive; }
        .leaderboard-list { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
        .lb-item { display: flex; align-items: center; justify-content: space-between; background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; padding: 12px 20px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .lb-item:hover { transform: scale(1.02); border-color: #a6e3a1; background: rgba(166,227,161,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .lb-rank { font-size: 24px; font-weight: bold; font-family: sans-serif; color: #6b7a62; width: 45px; text-align: center; }
        .lb-rank.top-1 { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); font-size: 32px; }
        .lb-rank.top-2 { color: #c0c0c0; text-shadow: 0 0 15px rgba(192,192,192,0.8); font-size: 28px; }
        .lb-rank.top-3 { color: #cd7f32; text-shadow: 0 0 15px rgba(205,127,50,0.8); font-size: 26px; }
        .lb-user { display: flex; align-items: center; gap: 15px; flex: 1; margin-left: 15px; }
        .lb-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lb-name { font-size: 22px; font-weight: bold; font-family: 'Neucha', cursive, sans-serif; }
        .lb-stats { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .lb-count { font-size: 26px; font-weight: bold; color: #fff; line-height: 1; font-family: 'Neucha', cursive, sans-serif; }
        .lb-count-label { font-size: 11px; color: #6b7a62; text-transform: uppercase; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { background: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; }
        .status-offline { background: #555; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading-screen">Анализ данных профиля...</div>

    <nav class="top-nav">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" class="nav-logo">Skinwalker Аниме</a>
            <button onclick="openUsersModal()" class="nav-btn">🔍 Поиск зрителей</button>
            <button onclick="openLeaderboard()" class="nav-btn" style="border-color: #ffd700; color: #ffd700;">🏆 Зал славы</button>
        </div>
        <div class="nav-auth" id="nav-auth">
            <button class="twitch-btn" onclick="loginTwitch()">Войти через Twitch</button>
        </div>
    </nav>

    <div class="layout" id="main-layout" style="display: none;">
        
        <div class="col-left">
            <div class="widget-base" style="flex: 1;">
                <div class="widget-content">
                    <div class="profile-card" id="profile-card"></div>
                    <div class="stat-grid">
                        <div class="stat-box"><div class="stat-val" id="stat-ovr">0</div><div class="stat-label">Ср. Оценка</div></div>
                        <div class="stat-box"><div class="stat-val" id="stat-count">0</div><div class="stat-label">Тайтлов</div></div>
                    </div>
                    <div style="border-top: 1px dashed #283325; margin: 5px 0;"></div>
                    <div style="color: #829c73; font-weight: bold; text-align: center; text-transform: uppercase; font-size: 15px; letter-spacing: 1px;">Вкусовой Радар</div>
                    <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="col-center">
            <div class="widget-base" style="flex: 1;">
                <div class="widget-header" style="display: flex; gap: 10px;">
                    <div class="widget-title">Оценки</div>
                    <select id="sort-ratings" onchange="renderRatings()" style="background: #121612; color: #a6e3a1; border: 1px solid #4a5c41; border-radius: 6px; font-family: 'Neucha', cursive; font-weight: bold; outline: none; cursor: pointer; padding: 2px 8px;">
                        <option value="high">Сначала высокие</option>
                        <option value="low">Сначала низкие</option>
                        <option value="new">Сначала новые</option>
                    </select>
                </div>
                <div class="widget-content">
                    <div class="hof-grid" id="hof-grid"></div>
                </div>
            </div>
        </div>

        <div class="col-right">
            <div class="widget-base" id="dynamic-right-panel" style="background: #0b0d0a; min-height: 400px; border: 2px solid var(--user-color, #a6e3a1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: border-color 0.5s, box-shadow 0.5s;">
                <div id="preview-placeholder" class="preview-placeholder">Наведите курсор на любой тайтл в сетке, чтобы увидеть статистику</div>
                
                <div id="preview-container" style="display: none; flex-direction: column;">
                    <img id="preview-cover" src="" class="preview-cover" alt="cover">
                    <div class="preview-content">
                        <div id="preview-title" class="preview-title">Название</div>
                        <div class="preview-score-box" id="preview-score-box">
                            <div class="preview-score-label" id="preview-score-label">Итоговая оценка</div>
                            <div id="preview-overall" class="preview-score-val">10<span> / 10</span></div>
                        </div>
                        <div class="preview-chart-wrap"><canvas id="previewChart"></canvas></div>
                        <div id="preview-avg-theory" class="preview-avg-theory">Ср. критерий: 0</div>
                        <div id="preview-theory-list" style="margin-bottom: 10px;"></div>
                        <div class="preview-comment" id="preview-comment"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- МОДАЛЬНЫЕ ОКНА ПОИСКА И ЛИДЕРБОРДА -->
    <div id="leaderboard-modal" class="leaderboard-overlay" style="display: none;" onclick="if(event.target===this) this.style.display='none'">
        <div class="leaderboard-box">
            <div class="close-btn" style="position: absolute; top: 15px; right: 20px; font-size: 32px; color: #a6e3a1; cursor: pointer; transition: 0.2s;" onclick="document.getElementById('leaderboard-modal').style.display='none'" onmouseover="this.style.color='#ff5555'" onmouseout="this.style.color='#a6e3a1'">×</div>
            <div class="leaderboard-header">Топ зрителей (Зал славы)</div>
            <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>
    </div>

    <div id="users-modal" class="leaderboard-overlay" style="display: none;" onclick="if(event.target===this) this.style.display='none'">
        <div class="leaderboard-box" style="height: 650px;">
            <div class="close-btn" style="position: absolute; top: 15px; right: 20px; font-size: 32px; color: #a6e3a1; cursor: pointer; transition: 0.2s; z-index: 10;" onclick="document.getElementById('users-modal').style.display='none'" onmouseover="this.style.color='#ff5555'" onmouseout="this.style.color='#a6e3a1'">×</div>
            <div class="leaderboard-header" style="border-bottom: none; padding-bottom: 15px;">Зрители с оценками</div>
            <div style="padding: 0 20px 15px 20px; border-bottom: 1px solid #283325;">
                <input type="text" id="modal-user-search" class="search-input" style="width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid #4a5c41; border-radius: 8px; padding: 12px 15px; color: #c4d1b8; outline: none; font-family: 'Neucha', cursive; font-size: 16px;" placeholder="Введите никнейм для поиска..." oninput="filterModalUsers()">
            </div>
            <div class="leaderboard-list" id="users-modal-list"></div>
        </div>
    </div>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = 'https://skinnystreams04-ai.github.io/Anime/';
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';
        let currentUser = null;
        let allRatedAnime = [];
        let targetUserId = null;
        let radarChart = null;
        let allActiveUsers = []; 

        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; 
            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }
            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile-neon">
                            <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color};">
                                <img src="${currentUser.profile_image_url}" class="user-avatar">
                            </div>
                            <div class="profile-info">
                                <div class="profile-top">
                                    <span class="profile-name-top" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color};">${currentUser.display_name}</span>
                                    <button class="logout-neon" onclick="logoutTwitch()">Выйти</button>
                                </div>
                                <div class="profile-bottom">
                                    ${uInfo.badge}
                                    <div class="wallet-item" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">
                                        <img src="icons/BILET_GOLD.png"> <span>${uInfo.gold}</span>
                                    </div>
                                    <div class="wallet-item" style="color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3);">
                                        <img src="icons/BILET.png"> <span>${uInfo.tickets}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    startOnlineHeartbeat();
                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        function startOnlineHeartbeat() {
            if (!currentUser) return;
            const updateOnline = () => {
                const dbId = currentUser.login.toLowerCase();
                fetch(`${FIREBASE_BASE}/global_users/${dbId}/last_online.json`, {
                    method: 'PUT', body: JSON.stringify(Date.now())
                }).catch(e => console.log('Heartbeat error', e));
            };
            updateOnline(); 
            setInterval(updateOnline, 60000); 
        }

        function getScoreColor(score, alpha = 1) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `rgba(107, 122, 98, ${alpha})`; 
            let r, g, b;
            if (numScore <= 5.5) {
                let p = (numScore - 1) / 4.5; if (p < 0) p = 0;
                r = Math.round(205 + p * (210 - 205)); g = Math.round(115 + p * (215 - 115)); b = Math.round(50 + p * (220 - 50));
            } else {
                let p = (numScore - 5.5) / 4.5; if (p > 1) p = 1;
                r = Math.round(210 + p * (255 - 210)); g = Math.round(215 + p * (235 - 215)); b = Math.round(220 + p * (20 - 220));
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        function getScoreShadow(score, isLarge) {
            const numScore = Number(score);
            const base = isLarge ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000' : '1px 1px 2px #000';
            if (numScore === 0 || isNaN(numScore)) return base;
            const color = getScoreColor(score, 1);
            const blur1 = Math.round(1 + (numScore / 10) * 5); 
            let glow = `${base}, 0 0 ${blur1}px ${color}`;
            if (numScore >= 8) glow += `, 0 0 ${Math.round(blur1 * 1.5)}px ${color}`;
            if (numScore === 10) glow += `, 0 0 15px rgba(255,255,255,0.3)`; 
            return glow;
        }
        function getGlassBoxStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: rgba(107,122,98,0.05); border: 1px solid rgba(107,122,98,0.2); box-shadow: none; backdrop-filter: blur(5px);`;
            const bg = getScoreColor(score, 0.15); const border = getScoreColor(score, 0.5); const glow = getScoreColor(score, 0.2);
            let blur = Math.round(4 + (numScore / 10) * 8);
            return `background: ${bg}; border: 1px solid ${border}; box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 ${blur}px ${glow} inset, 0 0 ${blur}px ${glow}; backdrop-filter: blur(5px);`;
        }
        function getGlassRowStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: transparent; border-left: 2px solid rgba(107,122,98,0.3);`;
            const bg = getScoreColor(score, 0.1); const border = getScoreColor(score, 0.8);
            return `background: linear-gradient(90deg, ${bg} 0%, transparent 100%); border-left: 2px solid ${border};`;
        }

        async function initProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            targetUserId = urlParams.get('user');
            if (!targetUserId) { document.getElementById('loading-screen').innerHTML = `<span style="color:#ff5555;">Пользователь не найден!</span>`; return; }

            try {
                const [usersRes, animeRes, commRes] = await Promise.all([
                    fetch(`${FIREBASE_BASE}/global_users.json`),
                    fetch(`${FIREBASE_BASE}/anime_db.json`),
                    fetch(`${FIREBASE_BASE}/community_db.json`)
                ]);

                const globalUsers = await usersRes.json() || {};
                const animeDb = await animeRes.json() || {};
                const commDb = await commRes.json() || {};
                
                window.globalUsersDB = globalUsers; 
                window.globalCommData = commDb;

                await checkTwitchAuth();

                processData(targetUserId, globalUsers, animeDb, commDb);
                
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-layout').style.display = 'flex';
            } catch (e) {
                console.error(e);
                document.getElementById('loading-screen').innerHTML = `<span style="color:#ff5555;">Ошибка загрузки базы данных!</span>`;
            }
        }

        window.userActivityData = []; 
        let previewRadarChart = null;

        function processData(userId, usersDb, animeDb, commDb) {
            let userName = "Неизвестный";
            let userAvatar = "https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png";
            let userColor = "#a6e3a1";
            let totalOverall = 0; let titleCount = 0;
            let th = { plot: 0, vis: 0, mus: 0, wor: 0, atm: 0 };
            let allActivityMap = {};
            
            const searchId = userId.toString().toLowerCase();

            for (const [franchise, seasons] of Object.entries(commDb)) {
                for (const [season, data] of Object.entries(seasons)) {
                    const animeInfo = animeDb[franchise] && animeDb[franchise][season] ? animeDb[franchise][season] : null;
                    if (!animeInfo) continue;

                    const titleName = animeInfo.title;
                    const cover = animeInfo.coverUrl;
                    const linkUrl = `Anime-Page.html?id=${franchise}`;
                    const key = `${franchise}_${season}`;

                    if (!allActivityMap[key]) { allActivityMap[key] = { title: titleName, cover: cover, link: linkUrl, timestamp: 0, overall: 0, theory: null, comment: null }; }
                    const actObj = allActivityMap[key];

                    let r = null;
                    if (data.ratings) {
                        if (data.ratings[userId]) {
                            r = data.ratings[userId]; 
                        } else {
                            const foundUid = Object.keys(data.ratings).find(uid => data.ratings[uid].displayName && data.ratings[uid].displayName.toLowerCase() === searchId);
                            if (foundUid) r = data.ratings[foundUid];
                        }
                    }

                    if (r) {
                        userName = r.displayName || userName; userAvatar = r.profileImage || userAvatar;
                        if (r.overall > 0) {
                            actObj.overall = r.overall; actObj.theory = r.theory; actObj.timestamp = Math.max(actObj.timestamp, r.timestamp);
                            totalOverall += r.overall; titleCount++;
                            if (r.theory) { th.plot += r.theory.plot || 0; th.vis += r.theory.visuals || 0; th.mus += r.theory.music || 0; th.wor += r.theory.world || 0; th.atm += r.theory.atmosphere || 0; }
                        }
                    }

                    if (data.comments) {
                        for (const [cId, c] of Object.entries(data.comments)) {
                            if (c.userId === userId || (c.displayName && c.displayName.toLowerCase() === searchId)) {
                                userName = c.displayName || userName; userAvatar = c.profileImage || userAvatar; userColor = c.userColor || userColor;
                                actObj.comment = c.text; actObj.timestamp = Math.max(actObj.timestamp, c.timestamp);
                            }
                        }
                    }
                }
            }

            const finalLogin = userName === "Неизвестный" ? searchId : userName.toLowerCase();
            const dbUser = usersDb[finalLogin];
            let role = "F"; 
            if (dbUser) { 
                if (dbUser.role) role = dbUser.role.toUpperCase(); 
                if (dbUser.color) userColor = dbUser.color; 
                if (userName === "Неизвестный" && dbUser.display_name) userName = dbUser.display_name;
            }

            userColor = userColor || '#a6e3a1'; 

            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (role === 'SUB' || role === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`; else if (role === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;

            let hex = userColor.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            let uR = parseInt(hex.substring(0,2), 16) || 166;
            let uG = parseInt(hex.substring(2,4), 16) || 227;
            let uB = parseInt(hex.substring(4,6), 16) || 161;

            document.documentElement.style.setProperty('--user-color', userColor);
            document.documentElement.style.setProperty('--user-color-rgb', `${uR}, ${uG}, ${uB}`);
            
            document.getElementById('profile-card').innerHTML = `
                <div class="avatar-wrap"><img src="${userAvatar}" class="profile-avatar"></div>
                <div class="profile-name" style="color: ${userColor}; text-shadow: 0 0 15px ${userColor}80;">${userName}</div>
                <div class="badges-row">${badgeHtml}</div>
            `;

            document.getElementById('stat-ovr').innerText = titleCount > 0 ? (totalOverall / titleCount).toFixed(1) : 0;
            document.getElementById('stat-count').innerText = titleCount;

            const ctx = document.getElementById('radarChart').getContext('2d');
            const avgT = titleCount > 0 ? [(th.plot / titleCount).toFixed(1), (th.vis / titleCount).toFixed(1), (th.mus / titleCount).toFixed(1), (th.wor / titleCount).toFixed(1), (th.atm / titleCount).toFixed(1)] : [0,0,0,0,0];
            if(radarChart) radarChart.destroy();
            radarChart = new Chart(ctx, { type: 'radar', data: { labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'], datasets: [{ data: avgT, backgroundColor: `${userColor}33`, borderColor: userColor, pointBackgroundColor: userColor, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: '#283325' }, angleLines: { color: '#283325' }, pointLabels: { font: { size: 13, weight: 'bold' }, color: '#c4d1b8' } } } } });

            let allActivity = Object.values(allActivityMap).filter(a => a.overall > 0 || a.comment);
            allActivity.sort((a,b) => b.timestamp - a.timestamp);
            window.userActivityData = allActivity; 

            renderRatings();
        }

        function renderRatings() {
            const container = document.getElementById('hof-grid');
            const sortType = document.getElementById('sort-ratings').value;
            
            let ratedList = window.userActivityData.map((data, index) => ({ data, index })).filter(item => item.data.overall > 0);
            let uniqueList = []; const seen = new Set();
            ratedList.forEach(item => { if(!seen.has(item.data.title)) { seen.add(item.data.title); uniqueList.push(item); } });

            if (sortType === 'high') uniqueList.sort((a, b) => b.data.overall - a.data.overall);
            else if (sortType === 'low') uniqueList.sort((a, b) => a.data.overall - b.data.overall);
            else if (sortType === 'new') uniqueList.sort((a, b) => b.data.timestamp - a.data.timestamp);

            if (uniqueList.length === 0) { container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7a62;">Пользователь еще ничего не оценил</div>`; return; }

            container.innerHTML = uniqueList.map(item => `
                <div class="hof-item" onmouseenter="openPreview(${item.index})" onclick="window.location.href='${item.data.link}'">
                    <img src="${item.data.cover}" class="hof-img">
                    <div class="hof-score">★ ${item.data.overall}</div>
                    <div class="hof-title-overlay">${item.data.title}</div>
                </div>
            `).join('');
        }

        function openPreview(index) {
            const data = window.userActivityData[index];
            if (!data) return;

            document.getElementById('preview-placeholder').style.display = 'none';
            document.getElementById('preview-container').style.display = 'flex';
            
            document.getElementById('preview-cover').src = data.cover;
            document.getElementById('preview-title').innerText = data.title;
            
            document.getElementById('preview-score-box').style.cssText = getGlassBoxStyle(data.overall);
            document.getElementById('preview-score-label').style.cssText = `color: ${getScoreColor(data.overall, 1)}; text-shadow: 0 0 5px ${getScoreColor(data.overall, 0.5)};`;
            document.getElementById('preview-overall').innerHTML = `${data.overall > 0 ? data.overall : '-'}<span> / 10</span>`;
            document.getElementById('preview-overall').style.cssText = `color: #fff; text-shadow: ${getScoreShadow(data.overall, true)};`;
            
            document.getElementById('preview-comment').innerHTML = data.comment ? `"${data.comment.replace(/\n/g, '<br>')}"` : '<span style="opacity:0.5; font-style: normal;">Только оценка, без рецензии.</span>';

            const t = data.theory || {plot:0, visuals:0, music:0, world:0, atmosphere:0};
            
            const avgTh = ((t.plot||0) + (t.visuals||0) + (t.music||0) + (t.world||0) + (t.atmosphere||0)) / 5;
            document.getElementById('preview-avg-theory').innerText = `Ср. критерий: ${avgTh > 0 ? avgTh.toFixed(1) : '-'}`;
            document.getElementById('preview-avg-theory').style.color = getScoreColor(avgTh, 1);
            document.getElementById('preview-avg-theory').style.textShadow = getScoreShadow(avgTh, false);

            const createRow = (name, val) => `<div class="preview-crit-row" style="${getGlassRowStyle(val)}"><span style="color:${getScoreColor(val, 1)}; text-shadow: 1px 1px 2px #000;">${name}</span><span style="color:#fff; text-shadow: ${getScoreShadow(val, false)};">${val || '-'}</span></div>`;
            
            document.getElementById('preview-theory-list').innerHTML = createRow('Сюжет', t.plot) + createRow('Визуал', t.visuals) + createRow('Музыка', t.music) + createRow('Мир', t.world) + createRow('Персонажи', t.atmosphere);

            const fallbackColor = getComputedStyle(document.documentElement).getPropertyValue('--user-color').trim() || '#a6e3a1';
            const colorThief = new ColorThief();
            const hiddenImg = new Image();
            hiddenImg.crossOrigin = 'Anonymous';
            hiddenImg.onload = function() {
                try {
                    const color = colorThief.getColor(hiddenImg);
                    const r = color[0], g = color[1], b = color[2];
                    
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                    let tr = r, tg = g, tb = b;
                    if (luminance < 90) { tr = Math.min(255, r+80); tg = Math.min(255, g+80); tb = Math.min(255, b+80); }

                    const themeColor = `rgb(${tr}, ${tg}, ${tb})`;
                    const rawColor = `rgba(${r}, ${g}, ${b}, 0.8)`;

                    const panel = document.getElementById('dynamic-right-panel');
                    panel.style.borderColor = rawColor;
                    panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(${r}, ${g}, ${b}, 0.3)`;

                    document.getElementById('preview-cover').style.borderColor = themeColor;
                    document.getElementById('preview-comment').style.borderColor = themeColor;
                    document.getElementById('preview-title').style.color = themeColor;
                    document.getElementById('preview-title').style.textShadow = `2px 2px 5px #000, 0 0 10px rgba(${r}, ${g}, ${b}, 0.5)`;

                    if (previewRadarChart) {
                        previewRadarChart.data.datasets[0].borderColor = themeColor;
                        previewRadarChart.data.datasets[0].backgroundColor = `rgba(${tr}, ${tg}, ${tb}, 0.2)`;
                        previewRadarChart.data.datasets[0].pointBackgroundColor = themeColor;
                        previewRadarChart.update();
                    }
                } catch(e) {}
            };
            hiddenImg.onerror = function() {
                const panel = document.getElementById('dynamic-right-panel');
                panel.style.borderColor = fallbackColor;
                panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 20px ${fallbackColor}40`;
                
                document.getElementById('preview-cover').style.borderColor = fallbackColor;
                document.getElementById('preview-comment').style.borderColor = fallbackColor;
                document.getElementById('preview-title').style.color = fallbackColor;
                
                if (previewRadarChart) {
                    previewRadarChart.data.datasets[0].borderColor = fallbackColor;
                    previewRadarChart.data.datasets[0].backgroundColor = fallbackColor + '40';
                    previewRadarChart.data.datasets[0].pointBackgroundColor = fallbackColor;
                    previewRadarChart.update();
                }
            };
            hiddenImg.src = data.cover + '?bypassCache=' + Date.now();

            const ctx = document.getElementById('previewChart').getContext('2d');
            if (previewRadarChart) {
                previewRadarChart.data.datasets[0].data = [t.plot||0, t.visuals||0, t.music||0, t.world||0, t.atmosphere||0];
                previewRadarChart.update();
            } else {
                previewRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: { labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'], datasets: [{ data: [t.plot||0, t.visuals||0, t.music||0, t.world||0, t.atmosphere||0], backgroundColor: fallbackColor + '40', borderColor: fallbackColor, pointBackgroundColor: fallbackColor, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 }] },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { filter: (i) => i.raw > 0 } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { font: { size: 11, weight: 'bold' }, color: '#c4d1b8' } } } }
                });
            }
        }

        // МОДАЛЬНЫЕ ОКНА: ЛОГИКА
        function openLeaderboard() {
            if (!window.globalCommData) return;
            const userStats = {};
            for (const [franchiseId, seasons] of Object.entries(window.globalCommData)) {
                for (const [seasonId, seasonData] of Object.entries(seasons)) {
                    if (seasonData.ratings) {
                        for (const [userId, rating] of Object.entries(seasonData.ratings)) {
                            if ((Number(rating.overall) > 0) || (rating.theory && Object.values(rating.theory).some(v => Number(v) > 0))) {
                                if (!userStats[userId]) { userStats[userId] = { id: userId, name: rating.displayName || userId, avatar: rating.profileImage || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png', count: 0 }; }
                                userStats[userId].count++;
                                if (rating.displayName) userStats[userId].name = rating.displayName;
                                if (rating.profileImage) userStats[userId].avatar = rating.profileImage;
                            }
                        }
                    }
                }
            }
            const sortedUsers = Object.values(userStats).sort((a, b) => b.count - a.count);
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';
            if (sortedUsers.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #6b7a62; padding: 30px; font-size: 18px;">Никто еще не оценивал аниме.</div>';
            } else {
                sortedUsers.forEach((u, index) => {
                    const rank = index + 1;
                    let rankClass = ''; let crown = rank;
                    if (rank === 1) { rankClass = 'top-1'; crown = '👑'; }
                    else if (rank === 2) { rankClass = 'top-2'; crown = '🥈'; }
                    else if (rank === 3) { rankClass = 'top-3'; crown = '🥉'; }
                    const dbUser = window.globalUsersDB[u.name.toLowerCase()];
                    const color = (dbUser && dbUser.color) ? dbUser.color : '#a4b09c';
                    const html = `
                    <a href="profile.html?user=${u.id}" class="lb-item">
                        <div class="lb-rank ${rankClass}">${crown}</div>
                        <div class="lb-user">
                            <img src="${u.avatar}" class="lb-avatar" style="border-color: ${color};">
                            <div class="lb-name" style="color: ${color}; text-shadow: 0 0 8px ${color}80;">${u.name}</div>
                        </div>
                        <div class="lb-stats">
                            <div class="lb-count">${u.count}</div>
                            <div class="lb-count-label">тайтлов</div>
                        </div>
                    </a>`;
                    listEl.insertAdjacentHTML('beforeend', html);
                });
            }
            document.getElementById('leaderboard-modal').style.display = 'flex';
        }

        function openUsersModal() {
            if (!window.globalCommData) return;
            const userStats = {};
            for (const [franchiseId, seasons] of Object.entries(window.globalCommData)) {
                for (const [seasonId, seasonData] of Object.entries(seasons)) {
                    if (seasonData.ratings) {
                        for (const [userId, rating] of Object.entries(seasonData.ratings)) {
                            if ((Number(rating.overall) > 0) || (rating.theory && Object.values(rating.theory).some(v => Number(v) > 0))) {
                                if (!userStats[userId]) { userStats[userId] = { id: userId, name: rating.displayName || userId, avatar: rating.profileImage || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png', count: 0 }; }
                                userStats[userId].count++;
                                if (rating.displayName) userStats[userId].name = rating.displayName;
                                if (rating.profileImage) userStats[userId].avatar = rating.profileImage;
                            }
                        }
                    }
                }
            }
            allActiveUsers = Object.values(userStats).sort((a, b) => a.name.localeCompare(b.name));
            document.getElementById('modal-user-search').value = '';
            renderModalUsers(allActiveUsers);
            document.getElementById('users-modal').style.display = 'flex';
        }

        function renderModalUsers(usersArray) {
            const listEl = document.getElementById('users-modal-list');
            listEl.innerHTML = '';
            if (usersArray.length === 0) { listEl.innerHTML = '<div style="text-align: center; color: #6b7a62; padding: 30px; font-size: 18px;">Никого не найдено.</div>'; return; }
            usersArray.forEach(u => {
                const dbUser = window.globalUsersDB[u.name.toLowerCase()];
                const color = (dbUser && dbUser.color) ? dbUser.color : '#a4b09c';
                const isOnline = dbUser && dbUser.last_online && (Date.now() - dbUser.last_online < 150000);
                const statusDot = isOnline ? '<div class="status-dot status-online" style="display:inline-block; margin-right:6px;"></div><span style="color:#a6e3a1; font-size:13px; font-family:sans-serif;">В сети</span>' : '<div class="status-dot status-offline" style="display:inline-block; margin-right:6px;"></div><span style="color:#6b7a62; font-size:13px; font-family:sans-serif;">Не в сети</span>';
                const html = `
                <a href="profile.html?user=${u.id}" class="lb-item" style="padding: 10px 20px;">
                    <div class="lb-user" style="margin-left: 0;">
                        <img src="${u.avatar}" class="lb-avatar" style="border-color: ${color}; width: 45px; height: 45px;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div class="lb-name" style="color: ${color}; text-shadow: 0 0 8px ${color}80; line-height: 1;">${u.name}</div>
                            <div style="display: flex; align-items: center;">${statusDot}</div>
                        </div>
                    </div>
                    <div class="lb-stats">
                        <div class="lb-count" style="font-size: 22px;">${u.count}</div>
                        <div class="lb-count-label" style="font-size: 10px;">оценок</div>
                    </div>
                </a>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        function filterModalUsers() {
            const query = document.getElementById('modal-user-search').value.toLowerCase().trim();
            if (!query) { renderModalUsers(allActiveUsers); return; }
            const filtered = allActiveUsers.filter(u => u.name.toLowerCase().includes(query));
            renderModalUsers(filtered);
        }

        window.onload = initProfile;
    </script>
</body>
</html>
