<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали Аниме</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; padding: 0 0 20px 0; font-family: 'Neucha', cursive, sans-serif; background-color: #0b0d0a; color: #a4b09c; min-width: 1350px; overflow-x: hidden; }
        
        .top-nav { background: #0b0d0a; border-bottom: 2px solid #283325; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .nav-logo { color: #a6e3a1; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #829c73; text-decoration: none; font-size: 18px; text-transform: uppercase; font-weight: bold; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.4); }
        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 6px; font-family: sans-serif; font-size: 14px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; }
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.6); }

        .layout { display: flex; gap: 20px; align-items: stretch; padding: 0 20px; }
        .widget-base { background: linear-gradient(180deg, #101411 0%, #080a08 100%); border: 2px solid #283325; border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; }
        .widget-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0b0d0a; border-bottom: 2px solid #283325; flex-shrink: 0; }
        .widget-title { color: #829c73; font-weight: bold; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .widget-content { padding: 15px; overflow-y: auto; flex: 1; position: relative; scrollbar-width: none; }
        
        .col-left { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .col-center { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .col-right { width: 420px; display: flex; flex-direction: column; gap: 20px; }

        .cover-img { width: 100%; border-radius: 6px; border: 1px solid #4a5c41; margin-bottom: 12px; }
        .genre-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; justify-content: center; }
        .genre-badge { background: #1a2618; color: #a6e3a1; border: 1px solid #4a5c41; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-family: sans-serif; font-weight: bold; text-transform: uppercase; }
        .info-row { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; border-bottom: 1px dashed #283325; padding-bottom: 4px; }
        .info-label { color: #829c73; } .info-val { color: #c4d1b8; font-weight: bold; text-align: right; }
        
        .imp-block { margin-top: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; border: 1px solid #283325; }
        .imp-title { color: #829c73; font-size: 18px; text-transform: uppercase; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #283325; padding-bottom: 5px; font-weight: bold;}
        
        .imp-score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 18px; padding: 4px 8px; border-radius: 6px; transition: 0.2s; cursor: pointer; }
        .imp-score-row:hover { background: rgba(255,255,255,0.05); }
        .imp-score-row .name { font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .imp-score-row .val { font-size: 26px; font-weight: bold; display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .imp-score-row .val span { font-size: 14px; color: #829c73; margin-top: 4px; text-shadow: none; }

        .player-nav { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .season-tabs { display: flex; gap: 10px; border-bottom: 2px solid #283325; padding-bottom: 10px; }
        .season-btn { background: rgba(0,0,0,0.4); border: 1px solid #4a5c41; color: #a4b09c; padding: 6px 16px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .season-btn:hover { background: #161a15; color: #c4d1b8; border-color: #829c73; }
        .season-btn.active { background: rgba(166, 227, 161, 0.15); border-color: #a6e3a1; color: #a6e3a1; box-shadow: 0 0 10px rgba(166, 227, 161, 0.2); }
        .custom-player { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; border: 1px solid #283325; display: flex; justify-content: center; align-items: center; color: #4a5c41; font-size: 24px; margin-bottom: 20px; }
        .synopsis-text { font-size: 16px; line-height: 1.5; color: #c4d1b8; text-align: justify; }

        .chart-wrapper { width: 100%; height: 260px; margin-bottom: 10px; }
        
        /* ПАНЕЛЬ СО СПИСКОМ КРИТЕРИЕВ */
        .interactive-legend { display: flex; justify-content: space-between; gap: 10px; background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .legend-col { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; padding: 10px 8px; border-radius: 6px; flex: 1; }
        .legend-col:hover { background: rgba(255,255,255,0.05); transform: scale(1.02); }
        .legend-title { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; text-transform: uppercase; text-shadow: 1px 1px 2px #000; margin-bottom: 6px;}
        .legend-score { font-size: 22px; font-weight: bold; padding: 2px 15px; border-radius: 4px; border: 1px solid transparent; text-shadow: 1px 1px 2px #000; margin-bottom: 5px;}
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0b0d0a; }

        /* СПИСОК (СЮЖЕТ, ВИЗУАЛ...) */
        .legend-breakdown { width: 100%; display: flex; flex-direction: column; gap: 5px; border-top: 1px dashed rgba(74, 92, 65, 0.6); padding-top: 8px; margin-top: 5px;}
        .crit-row { display: flex; justify-content: space-between; font-size: 14px; color: #a4b09c; }
        .crit-row span:last-child { font-weight: bold; text-shadow: 1px 1px 2px #000;}

        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0d0a; z-index: 9999; display: flex; justify-content: center; align-items: center; color: #a6e3a1; font-size: 24px; flex-direction: column; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading-screen">Загрузка данных из архива...</div>

    <nav class="top-nav" id="top-nav" style="display: none;">
        <div class="nav-logo">Skinwalker Аниме</div>
        <div class="nav-links"><a href="index.html">Главная</a></div>
        <div class="nav-auth"><button class="twitch-btn">Войти через Twitch</button></div>
    </nav>

    <div class="layout" style="display: none;" id="main-layout">
        <div class="col-left">
            <div class="widget-base" style="height: 100%;">
                <div class="widget-header"><div class="widget-title">Анализ</div></div>
                <div class="widget-content">
                    <img id="cover-img" src="" class="cover-img">
                    <div style="font-size: 24px; color: #c4d1b8; font-weight: bold; text-align: center; text-transform: uppercase; margin-bottom: 10px;" id="title-display">Название</div>
                    <div class="genre-badges" id="genres-display"></div>
                    <div class="info-row"><span class="info-label">Студия:</span><span class="info-val" id="studio-display">---</span></div>
                    <div class="info-row"><span class="info-label">Формат:</span><span class="info-val" id="format-display">---</span></div>
                    <div class="info-row"><span class="info-label">Рейтинг:</span><span class="info-val" id="rating-display">---</span></div>
                    <div class="info-row"><span class="info-label">Год:</span><span class="info-val" id="year-display">---</span></div>
                    <div class="info-row"><span class="info-label">Просмотрено:</span><span class="info-val" id="ep-display">--- / ---</span></div>
                    <div class="info-row"><span class="info-label">Дата просмотра:</span><span class="info-val" id="date-display">---</span></div>

                    <div class="imp-block">
                        <div class="imp-title">Общее впечатление</div>
                        <div class="imp-score-row" onmouseover="highlightChart(0)" onmouseout="resetChart()">
                            <div class="name" style="color: #cba6f7;">Стример</div><div class="val" id="streamer-score-val">0<span>/10</span></div>
                        </div>
                        <div class="imp-score-row" onmouseover="highlightChart(2)" onmouseout="resetChart()">
                            <div class="name" style="color: #a6e3a1;">Моя</div><div class="val" id="my-score-display" style="color: #6b7a62;">0<span>/10</span></div>
                        </div>
                        <div class="imp-score-row" onmouseover="highlightChart(1)" onmouseout="resetChart()">
                            <div class="name" style="color: #b8a87b;">Чат</div><div class="val" id="chat-score-val" style="color: #6b7a62;">0<span>/10</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-center">
            <div class="widget-base" style="height: 100%;">
                <div class="widget-header"><div class="widget-title">Медиатека</div></div>
                <div class="widget-content" style="display: flex; flex-direction: column;">
                    <div class="player-nav"><div class="season-tabs"><button class="season-btn active" id="active-season-tab">1 Сезон</button></div></div>
                    <div class="custom-player" id="player-view">▶ Плеер ожидает видеоряд</div>
                    <div style="margin-top: auto;">
                        <div style="color: #829c73; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #283325; padding-bottom: 5px;">Описание сюжета:</div>
                        <div class="synopsis-text" id="synopsis-display">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-right">
            <div class="widget-base" style="height: 100%;">
                <div class="widget-header"><div class="widget-title" id="stat-title">Статистика</div></div>
                <div class="widget-content">
                    <div class="chart-wrapper"><canvas id="detailsChart"></canvas></div>
                    
                    <div class="interactive-legend">
                        <div class="legend-col" onmouseover="highlightChart(0)" onmouseout="resetChart()">
                            <div class="legend-title" style="color: #cba6f7;"><div class="dot" style="background: #cba6f7;"></div>Стример</div>
                            <div class="legend-score" id="avg-streamer-score">0</div>
                            <div class="legend-breakdown" id="breakdown-streamer"></div>
                        </div>
                        <div class="legend-col" onmouseover="highlightChart(2)" onmouseout="resetChart()">
                            <div class="legend-title" style="color: #a6e3a1;"><div class="dot" style="background: #a6e3a1;"></div>Я</div>
                            <div class="legend-score" id="avg-viewer-score" style="color: #6b7a62; border-color: #6b7a62; background: rgba(107, 122, 98, 0.1);">0</div>
                            <div class="legend-breakdown" id="breakdown-viewer"></div>
                        </div>
                        <div class="legend-col" onmouseover="highlightChart(1)" onmouseout="resetChart()">
                            <div class="legend-title" style="color: #b8a87b;"><div class="dot" style="background: #b8a87b;"></div>Чат</div>
                            <div class="legend-score" id="avg-chat-score" style="color: #6b7a62; border-color: #6b7a62; background: rgba(107, 122, 98, 0.1);">0</div>
                            <div class="legend-breakdown" id="breakdown-chat"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // ДЕСЯТКА СНОВА ЗЕЛЕНАЯ! (Убрали исключение для золотого)
        function getScoreColor(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return '#6b7a62'; 
            const hue = (numScore / 10) * 120; 
            return `hsl(${hue}, 80%, 60%)`;
        }

        const ctx = document.getElementById('detailsChart').getContext('2d');
        Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73";
        
        const radarColors = [
            { bg: 'rgba(203, 166, 247, 0.2)', border: '#cba6f7' }, 
            { bg: 'rgba(184, 168, 123, 0.2)', border: '#b8a87b' }, 
            { bg: 'rgba(166, 227, 161, 0.2)', border: '#a6e3a1' }  
        ];
        
        let radarChart = new Chart(ctx, {
            type: 'radar',
            data: { 
                labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Атмосфера'], 
                datasets: [
                    { label: 'Стример', data: [0, 0, 0, 0, 0], backgroundColor: radarColors[0].bg, borderColor: radarColors[0].border, pointBackgroundColor: radarColors[0].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 3 }, 
                    { label: 'Чат', data: [0, 0, 0, 0, 0], backgroundColor: radarColors[1].bg, borderColor: radarColors[1].border, pointBackgroundColor: radarColors[1].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 3 }, 
                    { label: 'Я', data: [0, 0, 0, 0, 0], backgroundColor: radarColors[2].bg, borderColor: radarColors[2].border, pointBackgroundColor: radarColors[2].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 3 }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                plugins: { 
                    legend: { display: false },
                    tooltip: { filter: function(item) { return item.raw > 0; } }
                }, 
                scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: '#283325' }, angleLines: { color: '#283325' }, pointLabels: { font: { size: 13, weight: 'bold' }, color: '#c4d1b8' } } } 
            }
        });

        function highlightChart(index) {
            radarChart.data.datasets.forEach((ds, i) => {
                if (i !== index) { ds.backgroundColor = 'transparent'; ds.borderColor = 'rgba(255,255,255,0.05)'; ds.borderWidth = 1; }
                else { ds.backgroundColor = radarColors[i].border + '40'; ds.borderColor = radarColors[i].border; ds.borderWidth = 4; }
            });
            radarChart.update();
        }

        function resetChart() {
            radarChart.data.datasets.forEach((ds, i) => {
                ds.backgroundColor = radarColors[i].bg; ds.borderColor = radarColors[i].border; ds.borderWidth = 2;
            });
            radarChart.update();
        }

        // ГЕНЕРАЦИЯ СПИСКА КРИТЕРИЕВ
        function generateBreakdownHtml(theoryObj) {
            if (!theoryObj) theoryObj = {plot:0, visuals:0, music:0, world:0, atmosphere:0};
            return `
                <div class="crit-row"><span>Сюжет</span><span style="color:${getScoreColor(theoryObj.plot)}">${theoryObj.plot}</span></div>
                <div class="crit-row"><span>Визуал</span><span style="color:${getScoreColor(theoryObj.visuals)}">${theoryObj.visuals}</span></div>
                <div class="crit-row"><span>Музыка</span><span style="color:${getScoreColor(theoryObj.music)}">${theoryObj.music}</span></div>
                <div class="crit-row"><span>Мир</span><span style="color:${getScoreColor(theoryObj.world)}">${theoryObj.world}</span></div>
                <div class="crit-row"><span>Атмосфера</span><span style="color:${getScoreColor(theoryObj.atmosphere)}">${theoryObj.atmosphere}</span></div>
            `;
        }

        let franchiseData = {};

        async function loadAnimeData() {
            const urlParams = new URLSearchParams(window.location.search);
            const franchiseId = urlParams.get('id');
            if(!franchiseId) { document.getElementById('loading-screen').innerHTML = "ОШИБКА: Франшиза не выбрана!"; return; }

            const dbUrl = `https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/anime_db/${franchiseId}.json`;
            try {
                const res = await fetch(dbUrl);
                franchiseData = await res.json();
                
                if (!franchiseData) { document.getElementById('loading-screen').innerHTML = "ОШИБКА: Данные не найдены!"; return; }

                const seasonKeys = Object.keys(franchiseData);
                const tabsContainer = document.querySelector('.season-tabs');
                tabsContainer.innerHTML = ''; 
                
                seasonKeys.forEach((key, index) => {
                    const btn = document.createElement('button');
                    btn.className = `season-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = key.replace(/_/g, ' '); 
                    btn.onclick = () => {
                        document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderSeasonData(key);
                    };
                    tabsContainer.appendChild(btn);
                });

                renderSeasonData(seasonKeys[0]);

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('top-nav').style.display = 'flex';
                document.getElementById('main-layout').style.display = 'flex';
            } catch(e) { console.error(e); }
        }

        function renderSeasonData(seasonKey) {
            const anime = franchiseData[seasonKey];
            if (!anime) return;

            document.getElementById('cover-img').src = anime.coverUrl;
            document.getElementById('title-display').innerText = anime.title;
            document.getElementById('studio-display').innerText = anime.info.studio;
            document.getElementById('format-display').innerText = anime.info.format;
            document.getElementById('rating-display').innerText = anime.info.rating;
            document.getElementById('year-display').innerText = anime.info.year;
            document.getElementById('ep-display').innerText = `${anime.info.episodesWatched} / ${anime.info.episodesTotal}`;
            
            if(anime.info.dateWatched) {
                const [y, m, d] = anime.info.dateWatched.split('-');
                document.getElementById('date-display').innerText = `${d}.${m}.${y}`;
            } else { document.getElementById('date-display').innerText = "В процессе..."; }

            document.getElementById('synopsis-display').innerText = anime.info.description;

            if(anime.info.genres) {
                document.getElementById('genres-display').innerHTML = anime.info.genres.map(g => `<span class="genre-badge">${g}</span>`).join('');
            }

            const overall = anime.scores.overall || 0;
            const cOverall = getScoreColor(overall);
            const elOverall = document.getElementById('streamer-score-val');
            elOverall.innerHTML = `${overall}<span>/10</span>`;
            elOverall.style.color = cOverall;
            elOverall.style.textShadow = `0 0 15px ${cOverall}66, 2px 2px 4px #000`;
            
            const t = anime.scores.theory || {plot:0, visuals:0, music:0, world:0, atmosphere:0};
            radarChart.data.datasets[0].data = [t.plot, t.visuals, t.music, t.world, t.atmosphere];
            radarChart.update();
            
            const tSum = t.plot + t.visuals + t.music + t.world + t.atmosphere;
            const avg = tSum > 0 ? (tSum / 5).toFixed(1) : 0;
            const cAvg = getScoreColor(avg);
            
            // ОБНОВЛЕНИЕ ПАНЕЛИ СТРИМЕРА (С ЦИФРАМИ ВНИЗУ)
            const avgEl = document.getElementById('avg-streamer-score');
            avgEl.innerText = avg;
            avgEl.style.color = cAvg;
            avgEl.style.borderColor = cAvg;
            avgEl.style.background = cAvg + '1A';
            avgEl.style.boxShadow = `0 0 10px ${cAvg}40`;
            
            // Заполняем списки критериев
            document.getElementById('breakdown-streamer').innerHTML = generateBreakdownHtml(t);
            document.getElementById('breakdown-chat').innerHTML = generateBreakdownHtml(null); // Пока по нулям
            document.getElementById('breakdown-viewer').innerHTML = generateBreakdownHtml(null); // Пока по нулям
        }

        loadAnimeData();
    </script>
</body>
</html>
