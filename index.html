        .main-score { font-size: 30px; font-weight: bold; line-height: 1; letter-spacing: 2px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000; text-align: center; font-family: 'Neucha', cursive, sans-serif;}
        .main-score span { font-size: 13px; color: #c4d1b8; text-shadow: none !important; letter-spacing: normal; }

        /* ИНДИКАТОР НАЛИЧИЯ ПЛЕЕРА (КАМЕРА) */
        .vod-badge { position: absolute; top: 12px; left: 12px; background: rgba(11, 13, 10, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--card-border); color: var(--theme-light, #a6e3a1); width: 32px; height: 32px; border-radius: 8px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 10px var(--card-shadow); display: flex; justify-content: center; align-items: center; pointer-events: none; transition: 0.5s; }
        .vod-badge::before { content: ''; display: inline-block; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulseVod 1.5s infinite; }
        @keyframes pulseVod { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .user-search-input:focus { border-color: #a6e3a1; box-shadow: 0 0 10px rgba(166, 227, 161, 0.2), inset 0 2px 5px rgba(0,0,0,0.5); width: 260px; }
        .user-search-results { position: absolute; top: 100%; left: 0; width: 100%; background: #0b0d0a; border: 1px solid #283325; border-radius: 8px; margin-top: 10px; max-height: 300px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; flex-direction: column; }
        .user-search-item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #161a15; transition: 0.2s; text-decoration: none; }
        .user-search-item:hover { background: rgba(166, 227, 161, 0.1); border-left: 3px solid #a6e3a1; padding-left: 12px; }
        .us-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #4a5c41; }
        .us-info { display: flex; flex-direction: column; }
        .us-name { color: #fff; font-size: 16px; font-weight: bold; letter-spacing: 1px; }

        .status-online { background: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; }
        .status-offline { background: #555; }
    </style>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = 'https://skinnystreams04-ai.github.io/Anime/';
        const ADMIN_USERNAME = 'skinwalker_nozxc'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';

        let currentUser = null;
        let allCharts = {};
        let globalFranchises = []; 
        let currentSortDir = 'desc'; 
        
        window.globalUsersDB = {};

        const radarColors = [
            { bg: 'rgba(203, 166, 247, 0.2)', border: '#cba6f7' }, 
            { bg: 'rgba(184, 168, 123, 0.2)', border: '#b8a87b' }, 
            { bg: 'rgba(166, 227, 161, 0.2)', border: '#a6e3a1' }  
        ];
        
        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        function getScoreColor(score, alpha = 1) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `rgba(107, 122, 98, ${alpha})`; 
            
            let r, g, b;
            if (numScore <= 5.5) {
                let p = (numScore - 1) / 4.5;
                if (p < 0) p = 0;
                r = Math.round(205 + p * (210 - 205));
                g = Math.round(115 + p * (215 - 115));
                b = Math.round(50 + p * (220 - 50));
            } else {
                let p = (numScore - 5.5) / 4.5;
                if (p > 1) p = 1;
                r = Math.round(210 + p * (255 - 210));
                g = Math.round(215 + p * (235 - 215));
                b = Math.round(220 + p * (20 - 220));
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getScoreShadow(score, isLarge) {
            const numScore = Number(score);
            const base = isLarge 
                ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000' 
                : '1px 1px 2px #000';
                
            if (numScore === 0 || isNaN(numScore)) return base;
            
            const color = getScoreColor(score, 1);
            const blur1 = Math.round(1 + (numScore / 10) * 5); 
            let glow = `${base}, 0 0 ${blur1}px ${color}`;
            
            if (numScore >= 8) {
                const blur2 = Math.round(blur1 * 1.5);
                glow += `, 0 0 ${blur2}px ${color}`;
            }
            if (numScore === 10) {
                glow += `, 0 0 15px rgba(255,255,255,0.3)`; 
            }
            return glow;
        }

        function getGlassBoxStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: rgba(107,122,98,0.05); border: 1px solid rgba(107,122,98,0.2); box-shadow: none;`;
            
            const bg = getScoreColor(score, 0.1);
            const border = getScoreColor(score, 0.5);
            const glow = getScoreColor(score, 0.15);
            let blur = Math.round(4 + (numScore / 10) * 8);
            
            return `background: ${bg}; border: 1px solid ${border}; box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 ${blur}px ${glow} inset, 0 0 ${blur}px ${glow};`;
        }

            const bg = getScoreColor(score, 0.1);
            const border = getScoreColor(score, 0.8);
            return `background: linear-gradient(90deg, ${bg} 0%, transparent 100%); border-left: 2px solid ${border};`;
        }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; 

            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            
            if (dbUser) {

                if (dbUser.wallet_gold) g = dbUser.wallet_gold;

            }

            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile-neon">
                            <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color};">
                                <img src="${currentUser.profile_image_url}" class="user-avatar">
                            </div>
                            <div class="profile-info">

                                    <span class="profile-name" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color};">${currentUser.display_name}</span>
                                    <button class="logout-neon" onclick="logoutTwitch()">Выйти</button>
                                </div>
                                <div class="profile-bottom">
                                    ${uInfo.badge}
                                    <div class="wallet-item gold">

                                    </div>
                                    <div class="wallet-item tickets">
                                        <img src="icons/BILET.png"> <span>${uInfo.tickets}</span>
                                    </div>
                                </div>
                            </div>

                        document.body.classList.add('is-admin');
                    }

                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        function startOnlineHeartbeat() {

                const dbId = currentUser.login.toLowerCase();
                fetch(`${FIREBASE_BASE}/global_users/${dbId}/last_online.json`, {
                    method: 'PUT',

                    </div>`;

                const cardHtml = `
                <div class="card-container" id="card-${safeDomId}" data-cover="${safeCoverUrl}" onmouseenter="openHubPreview(${index})" onclick="window.location.href='${detailsLink}'" style="--card-color: #283325; --card-border: rgba(40, 51, 37, 0.8); --card-shadow: rgba(0,0,0,0.5); --card-shadow-hover: rgba(166, 227, 161, 0.25);">
                    <div class="card-face" style="background-image: url('${safeCoverUrl}');">
                        <div class="ep-badge">${f.badgeText}</div>
                        ${vodHtml}
                        <div class="front-overlay">
                            ${labelHtml}
                            <div class="scores-row">
                                <div class="score-box" style="${getGlassBoxStyle(valStr)}">
                                    <div class="score-label streamer" style="color:${getScoreColor(valStr, 1)}; border-bottom-color:${getScoreColor(valStr, 0.4)}; text-shadow:0 0 8px ${getScoreColor(valStr, 0.6)};">Стример</div>
                                    <div class="main-score" style="color:#fff; text-shadow:${getScoreShadow(valStr, true)};">${valStr}<span> / 10</span></div>
                                </div>
                                ${meBoxHtml}
                                <div class="score-box" style="${getGlassBoxStyle(valChat)}">
                                    <div class="score-label chat" style="color:${getScoreColor(valChat, 1)}; border-bottom-color:${getScoreColor(valChat, 0.4)}; text-shadow:0 0 8px ${getScoreColor(valChat, 0.6)};">Чат</div>
                                    <div class="main-score" style="color:#fff; text-shadow:${getScoreShadow(valChat, true)};">${valChat}<span> / 10</span></div>
                                </div>
                            </div>
                            <div class="divider"></div>
                            <div class="anime-title">${f.title}</div>
                        </div>
                    </div>
                </div>
                `;
                room.insertAdjacentHTML('beforeend', cardHtml);
            });

            extractHubColors();
        }

        function extractHubColors() {
            const colorThief = new ColorThief();
            document.querySelectorAll('.card-container').forEach(card => {
                const imgUrl = card.getAttribute('data-cover');
                const hiddenImg = new Image();
                hiddenImg.crossOrigin = 'Anonymous';
                hiddenImg.onload = function() {
                    try {
                        const color = colorThief.getColor(hiddenImg);
                        let r = color[0], g = color[1], b = color[2];
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                        let tr = r, tg = g, tb = b;
                        if (luminance < 90) { tr = Math.min(255, r + 80); tg = Math.min(255, g + 80); tb = Math.min(255, b + 80); }

                        card.style.setProperty('--card-color', `rgb(${r}, ${g}, ${b})`);
                        card.style.setProperty('--card-border', `rgba(${r}, ${g}, ${b}, 0.6)`);
                        card.style.setProperty('--card-shadow', `rgba(${r}, ${g}, ${b}, 0.2)`);
                        card.style.setProperty('--card-shadow-hover', `rgba(${r}, ${g}, ${b}, 0.8)`);
                        card.style.setProperty('--theme-light', `rgb(${tr}, ${tg}, ${tb})`); 
                    } catch(e) {}
                };
                hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
            });
        }

        function openHubPreview(index) {
            const f = window.currentRenderedCards[index];
            if (!f) return;

            const isStreamer = currentUser && currentUser.login.toLowerCase() === ADMIN_USERNAME.toLowerCase();
            const safeDomId = f.id.replace(/[^a-zA-Z0-9_-]/g, "_");
            const cardElem = document.getElementById(`card-${safeDomId}`);
            const s = f.scores;

            // Забираем уже вычисленные красивые цвета прямо из карточки!
            const themeLight = cardElem.style.getPropertyValue('--theme-light').trim() || '#a6e3a1';
            const cardBorder = cardElem.style.getPropertyValue('--card-border').trim() || 'rgba(166, 227, 161, 0.6)';
            const cardShadow = cardElem.style.getPropertyValue('--card-shadow-hover').trim() || 'rgba(166, 227, 161, 0.3)';

            document.getElementById('hub-preview-placeholder').style.display = 'none';
            document.getElementById('hub-preview-container').style.display = 'flex';
            
            // Красим панель
            const panel = document.getElementById('hub-right-panel');
            panel.style.borderColor = themeLight;
            panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 20px ${cardShadow}`;

            document.getElementById('hub-preview-cover').src = f.coverUrl;
            document.getElementById('hub-preview-cover').style.borderColor = themeLight;
            document.getElementById('hub-preview-title').innerText = f.title;
            document.getElementById('hub-preview-title').style.color = themeLight;
            document.getElementById('hub-preview-btn').style.borderColor = themeLight;
            document.getElementById('hub-preview-btn').onclick = () => window.location.href = `Anime-Page.html?id=${encodeURIComponent(f.id).replace(/'/g, "%27")}`;

            // --- ДОБАВЛЯЕМ ГЛОБАЛЬНЫЕ ФУНКЦИИ ПОДСВЕТКИ РАДАРА ---
            if (!window.hubHighlightChart) {
                window.hubHighlightChart = function(index) {
                    if (!hubRadarChart) return;
                    hubRadarChart.data.datasets.forEach((ds, i) => {
                        if (i !== index) { ds.backgroundColor = 'transparent'; ds.borderColor = 'rgba(255,255,255,0.05)'; ds.borderWidth = 1; }
                        else { ds.backgroundColor = radarColors[i].border + '40'; ds.borderColor = radarColors[i].border; ds.borderWidth = 4; }
                    });
                    hubRadarChart.update();
                };
                window.hubResetChart = function() {
                    if (!hubRadarChart) return;
                    hubRadarChart.data.datasets.forEach((ds, i) => { ds.backgroundColor = radarColors[i].bg; ds.borderColor = radarColors[i].border; ds.borderWidth = 2; });
                    hubRadarChart.update();
                };
            }

            const createStatCol = (title, chartColor, avgTheory, theory, isMe, chartIndex) => {
                if (isMe && isStreamer) return '';
                
                const numAvg = Number(avgTheory) || 0;
                
                // Цвет заголовка и оценки берется от значения Ср. Критерия
                const titleColor = numAvg > 0 ? getScoreColor(numAvg, 1) : '#6b7a62';
                const titleShadow = numAvg > 0 ? getScoreShadow(numAvg, false) : 'none';
                
                const row = (name, val) => {
                    const numVal = Number(val) || 0;
                    const textColor = numVal > 0 ? getScoreColor(numVal, 1) : '#6b7a62';
                    const textShadow = numVal > 0 ? getScoreShadow(numVal, false) : 'none';
                    const numColor = numVal > 0 ? '#fff' : '#555';
                    
                    return `
                    <div style="${getGlassRowStyle(numVal)} display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 0 6px 6px 0; margin-bottom: 4px;">
                        <span style="color: ${textColor}; font-family: 'Neucha', cursive; font-size: 15px; font-weight: bold; text-shadow: ${textShadow};">${name}</span>
                        <span style="color: ${numColor}; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-shadow: ${textShadow};">${val || '-'}</span>
                    </div>`;
                };

                return `
                <div style="${getGlassBoxStyle(numAvg)} flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 6px; border-radius: 8px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.02)'; this.style.filter='brightness(1.2)'; window.hubHighlightChart(${chartIndex});" onmouseout="this.style.transform='scale(1)'; this.style.filter='none'; window.hubResetChart();">
                    <div style="color: ${titleColor}; text-shadow: ${titleShadow}; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;">
                        <div style="width: 10px; height: 10px; border-radius: 50%; background: ${chartColor}; box-shadow: 0 0 5px ${chartColor};"></div>
                        ${title}
                    </div>
                    <div style="color: #fff; font-size: 26px; font-weight: bold; text-shadow: ${numAvg > 0 ? getScoreShadow(numAvg, true) : 'none'}; margin-bottom: 5px; font-family: 'Neucha', cursive;">${numAvg > 0 ? numAvg : '-'}</div>
                    
                    <div style="width: 100%; display: flex; flex-direction: column; gap: 4px; border-top: 1px dashed rgba(74, 92, 65, 0.6); padding-top: 8px; margin-top: 5px;">
                        ${row('Сюжет', theory.plot)}
                        ${row('Визуал', theory.visuals)}
                        ${row('Музыка', theory.music)}
                        ${row('Мир', theory.world)}
                        ${row('Персонажи', theory.atmosphere)}
                    </div>
                </div>
                `;
            };

            document.getElementById('hub-preview-theory').innerHTML = `
                <div style="display: flex; justify-content: space-between; gap: 10px; width: 100%;">
                    ${createStatCol('Стример', radarColors[0].border, s.streamer.avgTheory, s.streamer, false, 0)}
                    ${!isStreamer ? createStatCol('Я', radarColors[2].border, s.me.avgTheory, s.me, true, 2) : ''}
                    ${createStatCol('Чат', radarColors[1].border, s.chat.avgTheory, s.chat, false, 1)}
                </div>
            `;

            // Старая легенда нам больше не нужна, колонки сами всё объясняют!
            document.getElementById('hub-preview-legend').innerHTML = '';

            // Отрисовка радара
            const ctx = document.getElementById('hub-previewChart').getContext('2d');
            const datasets = [
                { data: [s.streamer.plot, s.streamer.visuals, s.streamer.music, s.streamer.world, s.streamer.atmosphere], backgroundColor: radarColors[0].bg, borderColor: radarColors[0].border, pointBackgroundColor: radarColors[0].border, borderWidth: 2, pointRadius: 2 },
                { data: [s.chat.plot, s.chat.visuals, s.chat.music, s.chat.world, s.chat.atmosphere], backgroundColor: radarColors[1].bg, borderColor: radarColors[1].border, pointBackgroundColor: radarColors[1].border, borderWidth: 2, pointRadius: 2 }
            ];
            if (!isStreamer) datasets.push({ data: [s.me.plot, s.me.visuals, s.me.music, s.me.world, s.me.atmosphere], backgroundColor: radarColors[2].bg, borderColor: radarColors[2].border, pointBackgroundColor: radarColors[2].border, borderWidth: 2, pointRadius: 2 });

            if (hubRadarChart) {
                hubRadarChart.data.datasets = datasets;
                hubRadarChart.update();
            } else {
                hubRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: { labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'], datasets: datasets },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { font: { size: 11, weight: 'bold' }, color: '#c4d1b8' } } } }
                });
            }
        }

        initApp();
    </script>
</body>
