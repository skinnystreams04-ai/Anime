<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skinwalker Аниме</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; padding: 0 0 40px 0; font-family: 'Neucha', cursive, sans-serif; background-color: #050605; color: #a4b09c; min-height: 100vh; overflow-x: hidden;}
        body.is-admin .me-element { display: none !important; }

        .top-nav { background: #0b0d0a; border-bottom: 2px solid #283325; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .nav-logo { color: #a6e3a1; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .nav-logo:hover { filter: brightness(1.2); text-shadow: 0 0 15px rgba(166, 227, 161, 0.5); }
        
        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 6px; font-family: sans-serif; font-size: 14px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; }
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.6); }
        
        /* === НОВЫЕ ЦВЕТА РОЛЕЙ === */
        .role-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); width: fit-content;}
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } /* Фиолетовый */
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; } /* Розовый */
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; } /* Серый */

        .user-profile { display: flex; align-items: center; gap: 15px; background: rgba(14, 17, 13, 0.8); padding: 6px 20px 6px 6px; border-radius: 30px; border: 1px solid #283325; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #4a5c41; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); }
        .logout-btn { background: transparent; border: none; color: #ff5555; cursor: pointer; font-size: 12px; font-family: sans-serif; text-transform: uppercase; font-weight: bold; transition: 0.2s; padding: 0; margin-left: 5px; }
        .logout-btn:hover { text-shadow: 0 0 8px rgba(255, 85, 85, 0.8); }

        .controls-bar { display: flex; justify-content: flex-start; align-items: center; gap: 20px; padding: 0 40px; margin-bottom: 30px; }
        .search-input, .sort-select { background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; color: #c4d1b8; padding: 10px 15px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 18px; outline: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .search-input { width: 250px; }
        .search-input::placeholder { color: #6b7a62; }
        .search-input:focus, .sort-select:focus { border-color: #a6e3a1; box-shadow: 0 0 15px rgba(166, 227, 161, 0.2); }
        .sort-select { cursor: pointer; appearance: none; padding-right: 30px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23829c73%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 12px auto; }
        .sort-select option { background: #0b0d0a; color: #c4d1b8; }
        
        .sort-dir-btn { background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; color: #a6e3a1; width: 44px; height: 44px; border-radius: 8px; font-family: sans-serif; font-size: 20px; font-weight: bold; cursor: pointer; outline: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; }
        .sort-dir-btn:hover { border-color: #a6e3a1; box-shadow: 0 0 15px rgba(166, 227, 161, 0.2); }

        .trophy-room { display: flex; justify-content: flex-start; align-items: flex-start; flex-wrap: wrap; gap: 40px; padding: 0 40px; }
        .card-container { width: 320px; height: 480px; perspective: 1000px; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid #283325; overflow: hidden; background: linear-gradient(180deg, #121612 0%, #0a0d0a 100%); display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(166, 227, 161, 0.08); transition: 0.3s; }
        .card-container:hover .card-face { box-shadow: 0 0 25px rgba(166, 227, 161, 0.25); border-color: #3d5236; }
        
        .card-front { background-size: cover; background-position: center; cursor: pointer; }
        .ep-badge { position: absolute; top: 15px; left: 15px; background: rgba(11, 13, 10, 0.85); border: 1px solid #4a5c41; color: #c4d1b8; font-size: 15px; font-weight: bold; padding: 4px 10px; border-radius: 6px; z-index: 10; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase;}
        
        .flip-btn { position: absolute; top: 15px; right: 15px; background: rgba(11, 13, 10, 0.85); border: 1px solid #4a5c41; color: #a4b09c; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; z-index: 20; }
        .flip-btn:hover { background: #161a15; color: #a6e3a1; border-color: #a6e3a1; transform: scale(1.1); }

        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 15px 15px 15px; box-sizing: border-box; background: linear-gradient(0deg, rgba(11, 13, 10, 1) 0%, rgba(11, 13, 10, 0.95) 40%, rgba(11, 13, 10, 0) 100%); display: flex; flex-direction: column; justify-content: flex-end; }
        
        .scores-row { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 8px; gap: 8px; }
        .score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(14, 17, 13, 0.35); border: 1px solid rgba(74, 92, 65, 0.3); padding: 8px 4px; border-radius: 8px; flex: 1; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .score-label { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px #000; text-align: center; }
        .score-label.streamer { color: #cba6f7; border-bottom-color: rgba(203, 166, 247, 0.3); }
        .score-label.me { color: #a6e3a1; border-bottom-color: rgba(166, 227, 161, 0.3); }
        .score-label.chat { color: #b8a87b; border-bottom-color: rgba(184, 168, 123, 0.3); }
        .main-score { font-size: 30px; font-weight: bold; line-height: 1; letter-spacing: 2px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000; text-align: center; }
        .main-score span { font-size: 13px; color: #c4d1b8; text-shadow: none; letter-spacing: normal; }

        .divider { border-top: 1px dashed #4a5c41; margin: 8px 0 12px 0; }
        .anime-title { color: #c4d1b8; font-size: 17px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 2px 2px 5px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; width: 100%; line-height: 1.2; }

        .card-back { transform: rotateY(180deg); padding: 20px; box-sizing: border-box; justify-content: space-between; }
        .back-title { text-align: center; font-size: 20px; color: #829c73; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #283325; padding-bottom: 10px; margin: 0; cursor: pointer; }
        .chart-container { width: 100%; height: 180px; position: relative; margin: 5px 0; cursor: pointer; }
        
        .custom-legend { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .legend-item:hover { filter: brightness(1.3); transform: scale(1.05); }
        .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0b0d0a; }

        .theory-container { background: rgba(0, 0, 0, 0.3); border: 1px solid #283325; border-radius: 8px; padding: 10px 12px; }
        .theory-row { margin-bottom: 10px; } .theory-row:last-child { margin-bottom: 0; }
        .theory-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        .theory-bar-bg { width: 100%; height: 6px; background: #121612; border-radius: 3px; overflow: hidden; border: 1px solid #1a2218; }
        .theory-bar-fill { height: 100%; border-radius: 3px; }
        
        .loading { font-size: 24px; color: #829c73; text-align: center; margin-top: 50px; width: 100%; }
        .secret-admin-btn { display: none; position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; background: rgba(11, 13, 10, 0.3); border: 1px solid #283325; color: #4a5c41; border-radius: 50%; justify-content: center; align-items: center; cursor: pointer; z-index: 9999; transition: 0.3s; opacity: 0.2; font-size: 18px; }
        .secret-admin-btn:hover { opacity: 1; background: #1a2618; color: #a6e3a1; border-color: #a6e3a1; box-shadow: 0 0 10px rgba(166,227,161,0.3); }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="nav-logo">Skinwalker Аниме</a>
        <div class="nav-auth" id="nav-auth">
            <button class="twitch-btn" onclick="loginTwitch()">Войти через Twitch</button>
        </div>
    </nav>

    <div class="controls-bar" style="display: none;" id="controls-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию..." oninput="applyFiltersAndSort()">
        
        <div style="display: flex; gap: 10px;">
            <select id="sort-select" class="sort-select" onchange="toggleRoleSelect(); applyFiltersAndSort();">
                <option value="overall">По Итоговой оценке</option>
                <option value="plot">По Сюжету</option>
                <option value="visuals">По Визуалу</option>
                <option value="music">По Музыке</option>
                <option value="world">По Миру</option>
                <option value="atmosphere">По Атмосфере</option>
                <option value="az">По алфавиту (A-Z)</option>
                <option value="date_watched">По дате просмотра</option>
                <option value="release_year">По дате выпуска</option>
                <option value="episodes">По количеству серий</option>
            </select>
            
            <select id="role-select" class="sort-select" onchange="applyFiltersAndSort()">
                <option value="streamer">Стример</option>
                <option value="me" class="me-element">Я</option>
                <option value="chat">Чат</option>
            </select>

            <button id="sort-dir-btn" class="sort-dir-btn" onclick="toggleSortDir()" title="Изменить направление">↓</button>
        </div>
    </div>

    <div id="trophy-room" class="trophy-room"><div class="loading">Синхронизация с базой...</div></div>
    <div class="secret-admin-btn" id="admin-btn" onclick="window.location.href='admin.html'" title="Панель управления">⚙️</div>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = 'https://skinnystreams04-ai.github.io/Anime/';
        const ADMIN_USERNAME = 'skinwalker_nozxc'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';

        let currentUser = null;
        let allCharts = {};
        let globalFranchises = []; 
        let currentSortDir = 'desc'; 
        
        window.globalUsersDB = {};

        const radarColors = [
            { bg: 'rgba(203, 166, 247, 0.2)', border: '#cba6f7' }, 
            { bg: 'rgba(184, 168, 123, 0.2)', border: '#b8a87b' }, 
            { bg: 'rgba(166, 227, 161, 0.2)', border: '#a6e3a1' }  
        ];
        
        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        window.addEventListener('pageshow', (event) => { if (event.persisted) { initApp(); } });

        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        // ЧИСТАЯ ФУНКЦИЯ ИЗВЛЕЧЕНИЯ ИНФОРМАЦИИ ПОЛЬЗОВАТЕЛЯ ИЗ GLOBAL_USERS
        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; // Ищем строго в global_users

            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }

            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            else if (r !== 'F') badgeHtml = `<span class="role-badge role-f">${r}</span>`;

            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile" style="padding: 6px 20px 6px 6px; border-radius: 30px; display: flex; gap: 15px; align-items: center;">
                            <img src="${currentUser.profile_image_url}">
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <div style="display: flex; align-items: center; justify-content: space-between;">
                                    <span style="color: ${uInfo.color}; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000;">${currentUser.display_name}</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    ${uInfo.badge}
                                </div>
                            </div>
                            <button class="logout-btn" onclick="logoutTwitch()">Выйти</button>
                        </div>
                    `;

                    if (currentUser.login.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                        document.getElementById('admin-btn').style.display = 'flex';
                        document.body.classList.add('is-admin');
                    }
                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        function getScoreColor(score) {
            const numScore = Number(score); if (numScore === 0 || isNaN(numScore)) return '#6b7a62'; 
            return `hsl(${(numScore / 10) * 120}, 80%, 60%)`;
        }

        function toggleRoleSelect() {
            const sortVal = document.getElementById('sort-select').value;
            const needsRole = ['overall', 'plot', 'visuals', 'music', 'world', 'atmosphere'].includes(sortVal);
            document.getElementById('role-select').style.display = needsRole ? 'block' : 'none';
        }

        function toggleSortDir() {
            currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
            document.getElementById('sort-dir-btn').innerText = currentSortDir === 'desc' ? '↓' : '↑';
            applyFiltersAndSort();
        }

        const getAvg = (sum, count) => count > 0 ? parseFloat((sum/count).toFixed(1)) : 0;

        async function initApp() {
            try {
                const dbRes = await fetch(`${FIREBASE_BASE}/global_users.json`, { cache: 'no-store' });
                if (dbRes.ok) { window.globalUsersDB = (await dbRes.json()) || {}; }
            } catch(e) { console.warn("Не удалось загрузить базу пользователей", e); }

            await checkTwitchAuth(); 

            try {
                const [animeRes, commRes] = await Promise.all([
                    fetch(`${FIREBASE_BASE}/anime_db.json`, { cache: 'no-store' }),
                    fetch(`${FIREBASE_BASE}/community_db.json`, { cache: 'no-store' })
                ]);
                const data = await animeRes.json();
                const commData = (await commRes.json()) || {};

                const room = document.getElementById('trophy-room');
                if (!data) { room.innerHTML = "<div class='loading'>Коллекция пуста.</div>"; return; }
                
                globalFranchises = []; 

                for (const [franchiseId, seasonsObj] of Object.entries(data)) {
                    const seasons = Object.entries(seasonsObj).map(([seasonId, sData]) => ({seasonId, ...sData}));
                    let totalEp = 0;
                    
                    let streamer = { overall:0, plot:0, vis:0, mus:0, wor:0, atm:0, countOv:0, countTh:0 };
                    let chat = { overall:0, plot:0, vis:0, mus:0, wor:0, atm:0, count:0 };
                    let me = { overall:0, plot:0, vis:0, mus:0, wor:0, atm:0, count:0 };

                    seasons.forEach(s => {
                        totalEp += parseInt(s.info.episodesTotal) || 0;
                        
                        if (s.scores && Number(s.scores.overall) > 0) { streamer.overall += Number(s.scores.overall); streamer.countOv++; }
                        if (s.scores && s.scores.theory) {
                            streamer.plot += Number(s.scores.theory.plot) || 0; streamer.vis += Number(s.scores.theory.visuals) || 0;
                            streamer.mus += Number(s.scores.theory.music) || 0; streamer.wor += Number(s.scores.theory.world) || 0;
                            streamer.atm += Number(s.scores.theory.atmosphere) || 0; streamer.countTh++;
                        }

                        const sComm = commData[franchiseId] && commData[franchiseId][s.seasonId] ? commData[franchiseId][s.seasonId].ratings : null;
                        if (sComm) {
                            for (const [uid, r] of Object.entries(sComm)) {
                                chat.overall += Number(r.overall) || 0;
                                if (r.theory) {
                                    chat.plot += Number(r.theory.plot) || 0; chat.vis += Number(r.theory.visuals) || 0;
                                    chat.mus += Number(r.theory.music) || 0; chat.wor += Number(r.theory.world) || 0; chat.atm += Number(r.theory.atmosphere) || 0;
                                }
                                chat.count++;

                                if (currentUser && uid === currentUser.id) {
                                    me.overall += Number(r.overall) || 0;
                                    if (r.theory) {
                                        me.plot += Number(r.theory.plot) || 0; me.vis += Number(r.theory.visuals) || 0;
                                        me.mus += Number(r.theory.music) || 0; me.wor += Number(r.theory.world) || 0; me.atm += Number(r.theory.atmosphere) || 0;
                                    }
                                    me.count++;
                                }
                            }
                        }
                    });

                    const scoresObj = {
                        streamer: {
                            overall: getAvg(streamer.overall, streamer.countOv),
                            plot: getAvg(streamer.plot, streamer.countTh), visuals: getAvg(streamer.vis, streamer.countTh),
                            music: getAvg(streamer.mus, streamer.countTh), world: getAvg(streamer.wor, streamer.countTh), atmosphere: getAvg(streamer.atm, streamer.countTh)
                        },
                        chat: {
                            overall: getAvg(chat.overall, chat.count),
                            plot: getAvg(chat.plot, chat.count), visuals: getAvg(chat.vis, chat.count),
                            music: getAvg(chat.mus, chat.count), world: getAvg(chat.wor, chat.count), atmosphere: getAvg(chat.atm, chat.count)
                        },
                        me: {
                            overall: getAvg(me.overall, me.count),
                            plot: getAvg(me.plot, me.count), visuals: getAvg(me.vis, me.count),
                            music: getAvg(me.mus, me.count), world: getAvg(me.wor, me.count), atmosphere: getAvg(me.atm, me.count)
                        }
                    };

                    scoresObj.streamer.avgTheory = getAvg(scoresObj.streamer.plot + scoresObj.streamer.visuals + scoresObj.streamer.music + scoresObj.streamer.world + scoresObj.streamer.atmosphere, 5);
                    scoresObj.chat.avgTheory = getAvg(scoresObj.chat.plot + scoresObj.chat.visuals + scoresObj.chat.music + scoresObj.chat.world + scoresObj.chat.atmosphere, 5);
                    scoresObj.me.avgTheory = getAvg(scoresObj.me.plot + scoresObj.me.visuals + scoresObj.me.music + scoresObj.me.world + scoresObj.me.atmosphere, 5);

                    const baseSeason = seasons[0];
                    globalFranchises.push({
                        id: franchiseId, title: franchiseId.replace(/_/g, ' '), coverUrl: baseSeason.coverUrl,
                        episodes: totalEp, badgeText: `${seasons.length}S ${totalEp}EP`,
                        release_year: parseInt(baseSeason.info.year) || 0, date_watched: baseSeason.info.dateWatched ? new Date(baseSeason.info.dateWatched).getTime() : 0,
                        az: franchiseId.replace(/_/g, ' ').toLowerCase(),
                        scores: scoresObj
                    });
                }

                document.getElementById('controls-bar').style.display = 'flex';
                toggleRoleSelect();
                applyFiltersAndSort();

            } catch (e) { console.error(e); }
        }

        function applyFiltersAndSort() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortVal = document.getElementById('sort-select').value;
            const roleVal = document.getElementById('role-select').value;
            const mult = currentSortDir === 'desc' ? 1 : -1;
            const needsRole = ['overall', 'plot', 'visuals', 'music', 'world', 'atmosphere'].includes(sortVal);

            let filtered = globalFranchises.filter(f => f.title.toLowerCase().includes(query));

            filtered.sort((a, b) => {
                let valA, valB;
                if (needsRole) {
                    valA = a.scores[roleVal][sortVal]; valB = b.scores[roleVal][sortVal];
                } else {
                    valA = a[sortVal]; valB = b[sortVal];
                }

                if (typeof valA === 'string') return valA.localeCompare(valB) * (mult === 1 ? 1 : -1);
                return (valB - valA) * mult;
            });

            renderCards(filtered);
        }

        function renderCards(arr) {
            const room = document.getElementById('trophy-room');
            Object.values(allCharts).forEach(chart => chart.destroy()); allCharts = {}; room.innerHTML = "";
            if (arr.length === 0) { room.innerHTML = "<div class='loading'>Ничего не найдено...</div>"; return; }

            arr.forEach(f => {
                const detailsLink = `Anime-Page.html?id=${encodeURIComponent(f.id)}`;
                const s = f.scores;

                const cardHtml = `
                <div class="card-container" id="card-${f.id}" onmouseleave="this.classList.remove('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front" style="background-image: url('${f.coverUrl}');" onclick="if(!event.target.closest('.flip-btn')) window.location.href='${detailsLink}'">
                            <div class="ep-badge">${f.badgeText}</div>
                            <div class="flip-btn" onmouseenter="document.getElementById('card-${f.id}').classList.add('is-flipped')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.1-8.91L2 9M2.5 22v-6h6M21.87 8.43a10 10 0 1 0-3.1 8.91l3.23-2.34"/></svg></div>
                            <div class="front-overlay">
                                <div class="scores-row">
                                    <div class="score-box"><div class="score-label streamer">Стример</div><div class="main-score" style="color:${getScoreColor(s.streamer.overall)};">${s.streamer.overall}<span> / 10</span></div></div>
                                    <div class="score-box me-element"><div class="score-label me">Я</div><div class="main-score" style="color:${getScoreColor(s.me.overall)};">${s.me.overall}<span> / 10</span></div></div>
                                    <div class="score-box"><div class="score-label chat">Чат</div><div class="main-score" style="color:${getScoreColor(s.chat.overall)};">${s.chat.overall}<span> / 10</span></div></div>
                                </div>
                                <div class="divider"></div>
                                <div class="anime-title">${f.title}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <h3 class="back-title" onclick="window.location.href='${detailsLink}'">Критерии</h3>
                            <div class="chart-container" onclick="window.location.href='${detailsLink}'"><canvas id="chart-${f.id}"></canvas></div>
                            <div class="custom-legend">
                                <div class="legend-item" style="color: ${radarColors[0].border};" onmouseover="highlightChart('${f.id}', 0)" onmouseout="resetChart('${f.id}')"><div class="dot" style="background: ${radarColors[0].border};"></div>Стример</div>
                                <div class="legend-item me-element" style="color: ${radarColors[2].border};" onmouseover="highlightChart('${f.id}', 2)" onmouseout="resetChart('${f.id}')"><div class="dot" style="background: ${radarColors[2].border};"></div>Я</div>
                                <div class="legend-item" style="color: ${radarColors[1].border};" onmouseover="highlightChart('${f.id}', 1)" onmouseout="resetChart('${f.id}')"><div class="dot" style="background: ${radarColors[1].border};"></div>Чат</div>
                            </div>
                            <div class="theory-container">
                                <div class="theory-row"><div class="theory-label"><span style="color: #fff;">Стример</span><span style="color: ${getScoreColor(s.streamer.avgTheory)};">${s.streamer.avgTheory}/10</span></div><div class="theory-bar-bg"><div class="theory-bar-fill" style="width: ${s.streamer.avgTheory * 10}%; background: ${getScoreColor(s.streamer.avgTheory)};"></div></div></div>
                                <div class="theory-row"><div class="theory-label"><span style="color: #fff;">Чат</span><span style="color: ${getScoreColor(s.chat.avgTheory)};">${s.chat.avgTheory}/10</span></div><div class="theory-bar-bg"><div class="theory-bar-fill" style="width: ${s.chat.avgTheory * 10}%; background: ${getScoreColor(s.chat.avgTheory)};"></div></div></div>
                                <div class="theory-row me-element"><div class="theory-label"><span style="color: #fff;">Я</span><span style="color: ${getScoreColor(s.me.avgTheory)};">${s.me.avgTheory}/10</span></div><div class="theory-bar-bg"><div class="theory-bar-fill" style="width: ${s.me.avgTheory * 10}%; background: ${getScoreColor(s.me.avgTheory)};"></div></div></div>
                            </div>
                            <button onclick="window.location.href='${detailsLink}'" style="margin-top: 10px; width: 100%; background: #222b20; border: 1px solid #4a5c41; color: #a4b09c; padding: 6px; font-family: 'Neucha', cursive; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;">Медиатека ▶</button>
                        </div>
                    </div>
                </div>
                `;
                room.insertAdjacentHTML('beforeend', cardHtml);

                if (typeof Chart !== 'undefined') {
                    allCharts[f.id] = new Chart(document.getElementById(`chart-${f.id}`).getContext('2d'), {
                        type: 'radar',
                        data: {
                            labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Атмосфера'],
                            datasets: [
                                { data: [s.streamer.plot, s.streamer.visuals, s.streamer.music, s.streamer.world, s.streamer.atmosphere], backgroundColor: radarColors[0].bg, borderColor: radarColors[0].border, pointBackgroundColor: radarColors[0].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 },
                                { data: [s.chat.plot, s.chat.visuals, s.chat.music, s.chat.world, s.chat.atmosphere], backgroundColor: radarColors[1].bg, borderColor: radarColors[1].border, pointBackgroundColor: radarColors[1].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 },
                                { data: [s.me.plot, s.me.visuals, s.me.music, s.me.world, s.me.atmosphere], backgroundColor: radarColors[2].bg, borderColor: radarColors[2].border, pointBackgroundColor: radarColors[2].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { filter: function(item) { return item.raw > 0; }, displayColors: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: '#283325' }, angleLines: { color: '#283325' }, pointLabels: { font: { size: 12, weight: 'bold' }, color: '#c4d1b8' } } } }
                    });
                }
            });
        }
        
        function highlightChart(animeId, index) {
            if(!allCharts[animeId]) return;
            allCharts[animeId].data.datasets.forEach((ds, i) => {
                if (i !== index) { ds.backgroundColor = 'transparent'; ds.borderColor = 'rgba(255,255,255,0.05)'; ds.borderWidth = 1; }
                else { ds.backgroundColor = radarColors[i].border + '40'; ds.borderColor = radarColors[i].border; ds.borderWidth = 4; }
            });
            allCharts[animeId].update();
        }

        function resetChart(animeId) {
            if(!allCharts[animeId]) return;
            allCharts[animeId].data.datasets.forEach((ds, i) => { ds.backgroundColor = radarColors[i].bg; ds.borderColor = radarColors[i].border; ds.borderWidth = 2; });
            allCharts[animeId].update();
        }

        initApp();
    </script>
</body>
</html>
