<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skinwalker Аниме</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

    <style>
        body { margin: 0; padding: 0 0 40px 0; font-family: 'Neucha', cursive, sans-serif; background-color: #050605; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); color: #a4b09c; min-height: 100vh; overflow-x: hidden; }

        .top-nav { background: #0b0d0a; border-bottom: 2px solid #283325; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .nav-logo { color: #a6e3a1; font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .nav-logo:hover { filter: brightness(1.2); text-shadow: 0 0 15px rgba(166, 227, 161, 0.5); }

        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }
        
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid rgba(166, 227, 161, 0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: 0.3s ease; }
        .user-profile-neon:hover { background: rgba(15, 20, 15, 0.3); border-color: rgba(166, 227, 161, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(166, 227, 161, 0.1); }
        
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; transition: 0.3s; }
        .user-profile-neon:hover .avatar-glow-wrap::before { opacity: 0.6; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-name { font-family: 'Neucha', cursive; font-size: 22px; font-weight: bold; letter-spacing: 1px; line-height: 1; }
        
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        
        .role-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-family: 'Neucha', cursive; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); line-height: 1.2; width: fit-content;}
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } 
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; } 
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; } 

        .wallet-item { display: flex; align-items: center; gap: 6px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; line-height: 1; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .wallet-item.gold { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .wallet-item.tickets { color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3); }

        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-family: 'Neucha', cursive; font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; line-height: 1; letter-spacing: 1px;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }

        .controls-bar { display: flex; justify-content: flex-start; align-items: center; gap: 15px; padding: 12px 25px; margin: 0 40px 30px 40px; background: rgba(14, 17, 13, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(166, 227, 161, 0.2); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .controls-divider { width: 1px; height: 30px; background: rgba(166, 227, 161, 0.2); margin: 0 10px; }
        
        .search-input, .sort-select { background: transparent; border: none; border-bottom: 1px solid rgba(166, 227, 161, 0.2); color: #c4d1b8; padding: 8px 12px; font-family: 'Neucha', cursive; font-size: 18px; outline: none; transition: 0.3s; border-radius: 0; }
        .search-input { width: 250px; }
        .search-input::placeholder { color: #6b7a62; }
        
        .sort-select { cursor: pointer; appearance: none; padding-right: 30px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23829c73%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 12px auto; }
        .sort-select option { background: #0b0d0a; color: #c4d1b8; }
        
        .search-input:focus, .sort-select:focus { border-bottom: 1px solid #a6e3a1; box-shadow: 0 5px 15px -5px rgba(166, 227, 161, 0.3); }
        .sort-dir-btn { background: transparent; border: none; color: #6b7a62; padding: 0 5px 0 15px; font-family: sans-serif; font-size: 24px; font-weight: bold; cursor: pointer; outline: none; transition: 0.2s; display: flex; justify-content: center; align-items: center; line-height: 1; }
        .sort-dir-btn:hover { color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.5); transform: translateY(-3px); }

        .trophy-room { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; padding: 0 40px; }
        .card-container { width: 100%; aspect-ratio: 2 / 3; perspective: 1000px; position: relative; max-width: 300px; justify-self: center; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-container::before { content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background: var(--card-color); filter: blur(50px); opacity: 0.15; z-index: -1; transition: opacity 0.5s, transform 0.5s; border-radius: 50%; }
        .card-container:hover::before { opacity: 0.3; transform: scale(1.05); }
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        /* ИЗМЕНЕНА СВЕТИМОСТЬ КАРТОЧЕК НА ОСНОВЕ ОЦЕНКИ */
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #121612 0%, #0a0d0a 100%); display: flex; flex-direction: column; transition: 0.3s; border: 2px solid var(--card-border); box-shadow: 0 0 15px var(--card-shadow); }
        .card-container:hover .card-face { border-color: var(--card-color); box-shadow: 0 0 30px var(--card-shadow-hover); }
        
        .card-front { background-size: cover; background-position: center; cursor: pointer; }
        .ep-badge { position: absolute; top: 15px; left: 15px; background: rgba(11, 13, 10, 0.85); border: 1px solid #4a5c41; color: #c4d1b8; font-size: 15px; font-weight: bold; padding: 4px 10px; border-radius: 6px; z-index: 10; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase;}
        
        .flip-btn { position: absolute; top: 15px; right: 15px; background: rgba(11, 13, 10, 0.85); border: 1px solid #4a5c41; color: #a4b09c; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; z-index: 20; }
        .flip-btn:hover { background: #161a15; color: #a6e3a1; border-color: #a6e3a1; transform: scale(1.1); }

        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 15px 15px 15px; box-sizing: border-box; background: linear-gradient(0deg, var(--overlay-solid, rgba(11, 13, 10, 1)) 0%, var(--overlay-fade, rgba(11, 13, 10, 0.95)) 50%, rgba(11, 13, 10, 0) 100%); display: flex; flex-direction: column; justify-content: flex-end; }
        
        .scores-row { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 8px; gap: 8px; }
        .score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; border-radius: 8px; flex: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: 0.3s;}
        
        .score-label { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px #000; text-align: center; }
        .main-score { font-size: 30px; font-weight: bold; line-height: 1; letter-spacing: 2px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000; text-align: center; font-family: 'Neucha', cursive, sans-serif;}
        .main-score span { font-size: 13px; color: #c4d1b8; text-shadow: none !important; letter-spacing: normal; }

        .divider { border-top: 1px dashed #4a5c41; margin: 8px 0 12px 0; }
        .anime-title { color: #c4d1b8; font-size: 17px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 2px 2px 5px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; width: 100%; line-height: 1.2; }

        .card-back { transform: rotateY(180deg); padding: 15px; box-sizing: border-box; justify-content: space-between; }
        .back-title { text-align: center; font-size: 18px; color: var(--theme-primary); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--theme-panel-border); padding-bottom: 5px; margin: 0; cursor: pointer; text-shadow: 0 0 8px var(--theme-glow); }
        .chart-container { width: 100%; height: 220px; position: relative; margin: 0; cursor: pointer; }
        
        .custom-legend { display: flex; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .legend-item:hover { filter: brightness(1.3); transform: scale(1.05); }
        .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0b0d0a; }

        .theory-container { background: transparent; border: none; padding: 0; }
        .crit-row { display: flex; justify-content: space-between; font-size: 13px; color: #a4b09c; padding: 2px 8px; border-radius: 0 6px 6px 0; margin-bottom: 4px; transition: 0.2s;}
        .crit-row span:last-child { font-weight: bold; font-family: 'Neucha', cursive, sans-serif; }
        
        .loading { font-size: 24px; color: #829c73; text-align: center; margin-top: 50px; width: 100%; }
        .secret-admin-btn { display: none; position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; background: rgba(11, 13, 10, 0.3); border: 1px solid #283325; color: #4a5c41; border-radius: 50%; justify-content: center; align-items: center; cursor: pointer; z-index: 9999; transition: 0.3s; opacity: 0.2; font-size: 18px; }
        .secret-admin-btn:hover { opacity: 1; background: #1a2618; color: #a6e3a1; border-color: #a6e3a1; box-shadow: 0 0 10px rgba(166,227,161,0.3); }
        }
        /* ИНДИКАТОР НАЛИЧИЯ ПЛЕЕРА (КАМЕРА) */
        .vod-badge { position: absolute; top: 10px; right: 45px; background: rgba(11, 13, 10, 0.85); border: 1px solid #4a5c41; color: #a6e3a1; padding: 6px; border-radius: 6px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .vod-badge::before { content: ''; display: inline-block; width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulseVod 1.5s infinite; }
        @keyframes pulseVod { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        /* Прячем колонку "Я" для стримера (админа) */
        body.is-admin .me-element { display: none !important; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="nav-logo">Skinwalker Аниме</a>
        <div class="nav-auth" id="nav-auth">
            <button class="twitch-btn" onclick="loginTwitch()">Войти через Twitch</button>
        </div>
    </nav>

    <div class="controls-bar" style="display: none;" id="controls-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию..." oninput="applyFiltersAndSort()">
        
        <div class="controls-divider"></div>
        
        <select id="sort-select" class="sort-select" onchange="toggleRoleSelect(); applyFiltersAndSort();">
            <option value="overall">По Итоговой оценке</option>
            <option value="avgTheory">По среднему Критериев</option>
            <option value="plot">По Сюжету</option>
            <option value="visuals">По Визуалу</option>
            <option value="music">По Музыке</option>
            <option value="world">По Миру</option>
            <option value="atmosphere">По Персонажам</option>
            <option value="az">По алфавиту (A-Z)</option>
            <option value="date_watched">По дате просмотра</option>
            <option value="release_year">По дате выпуска</option>
            <option value="episodes">По количеству серий</option>
        </select>
        
        <div class="controls-divider" id="role-divider"></div>
        
        <select id="role-select" class="sort-select" onchange="applyFiltersAndSort()">
            <option value="streamer">Стример</option>
            <option value="me" class="me-element">Я</option>
            <option value="chat">Чат</option>
        </select>

        <button id="sort-dir-btn" class="sort-dir-btn" onclick="toggleSortDir()" title="Изменить направление">↓</button>
    </div>

    <div id="trophy-room" class="trophy-room"><div class="loading">Синхронизация с базой...</div></div>
    <div class="secret-admin-btn" id="admin-btn" onclick="window.location.href='admin.html'" title="Панель управления">⚙️</div>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = 'https://skinnystreams04-ai.github.io/Anime/';
        const ADMIN_USERNAME = 'skinwalker_nozxc'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';

        let currentUser = null;
        let allCharts = {};
        let globalFranchises = []; 
        let currentSortDir = 'desc'; 
        
        window.globalUsersDB = {};

        const radarColors = [
            { bg: 'rgba(203, 166, 247, 0.2)', border: '#cba6f7' }, 
            { bg: 'rgba(184, 168, 123, 0.2)', border: '#b8a87b' }, 
            { bg: 'rgba(166, 227, 161, 0.2)', border: '#a6e3a1' }  
        ];
        
        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        function getScoreColor(score, alpha = 1) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `rgba(107, 122, 98, ${alpha})`; 
            
            let r, g, b;
            if (numScore <= 5.5) {
                let p = (numScore - 1) / 4.5;
                if (p < 0) p = 0;
                r = Math.round(205 + p * (210 - 205));
                g = Math.round(115 + p * (215 - 115));
                b = Math.round(50 + p * (220 - 50));
            } else {
                let p = (numScore - 5.5) / 4.5;
                if (p > 1) p = 1;
                r = Math.round(210 + p * (255 - 210));
                g = Math.round(215 + p * (235 - 215));
                b = Math.round(220 + p * (20 - 220));
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getScoreShadow(score, isLarge) {
            const numScore = Number(score);
            const base = isLarge 
                ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000' 
                : '1px 1px 2px #000';
                
            if (numScore === 0 || isNaN(numScore)) return base;
            
            const color = getScoreColor(score, 1);
            const blur1 = Math.round(1 + (numScore / 10) * 5); 
            let glow = `${base}, 0 0 ${blur1}px ${color}`;
            
            if (numScore >= 8) {
                const blur2 = Math.round(blur1 * 1.5);
                glow += `, 0 0 ${blur2}px ${color}`;
            }
            if (numScore === 10) {
                glow += `, 0 0 15px rgba(255,255,255,0.3)`; 
            }
            return glow;
        }

        function getGlassBoxStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: rgba(107,122,98,0.05); border: 1px solid rgba(107,122,98,0.2); box-shadow: none;`;
            
            const bg = getScoreColor(score, 0.1);
            const border = getScoreColor(score, 0.5);
            const glow = getScoreColor(score, 0.15);
            let blur = Math.round(4 + (numScore / 10) * 8);
            
            return `background: ${bg}; border: 1px solid ${border}; box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 ${blur}px ${glow} inset, 0 0 ${blur}px ${glow};`;
        }

        function getGlassRowStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: transparent; border-left: 2px solid rgba(107,122,98,0.3);`;
            
            const bg = getScoreColor(score, 0.1);
            const border = getScoreColor(score, 0.8);
            return `background: linear-gradient(90deg, ${bg} 0%, transparent 100%); border-left: 2px solid ${border};`;
        }

        function toggleRoleSelect() {
            const sortVal = document.getElementById('sort-select').value;
            const needsRole = ['overall', 'avgTheory', 'plot', 'visuals', 'music', 'world', 'atmosphere'].includes(sortVal);
            const rs = document.getElementById('role-select');
            const rd = document.getElementById('role-divider');
            if(rs) rs.style.display = needsRole ? 'block' : 'none';
            if(rd) rd.style.display = needsRole ? 'block' : 'none';
        }

        function toggleSortDir() {
            currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
            document.getElementById('sort-dir-btn').innerText = currentSortDir === 'desc' ? '↓' : '↑';
            applyFiltersAndSort();
        }

        const safeNum = (v) => Number(v) || 0;
        const getAvg = (sum, count) => count > 0 ? parseFloat((sum/count).toFixed(1)) : 0;

        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; 

            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }

            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;

            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();

                        { data: [s.chat.plot, s.chat.visuals, s.chat.music, s.chat.world, s.chat.atmosphere], backgroundColor: radarColors[1].bg, borderColor: radarColors[1].border, pointBackgroundColor: radarColors[1].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 }
                    ];
                    if (!isStreamer) datasets.push({ data: [s.me.plot, s.me.visuals, s.me.music, s.me.world, s.me.atmosphere], backgroundColor: radarColors[2].bg, borderColor: radarColors[2].border, pointBackgroundColor: radarColors[2].border, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 });

                    allCharts[safeDomId] = new Chart(document.getElementById(`chart-${safeDomId}`).getContext('2d'), {
                        type: 'radar',
                        data: { labels: ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'], datasets: datasets },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { filter: function(item) { return item.raw > 0; }, displayColors: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: 'rgba(255,255,255,0.05)' }, angleLines: { color: 'rgba(255,255,255,0.05)' }, pointLabels: { font: { size: 12, weight: 'bold' }, color: '#c4d1b8' } } } }
                    });
                }
            });

            extractHubColors();
        }

function extractHubColors() {
    const colorThief = new ColorThief();
    document.querySelectorAll('.card-container').forEach(card => {
        const imgUrl = card.getAttribute('data-cover');
        const hiddenImg = new Image();
        hiddenImg.crossOrigin = 'Anonymous';
        hiddenImg.onload = function() {
            try {
                const color = colorThief.getColor(hiddenImg);
                let r = color[0], g = color[1], b = color[2];
                card.style.setProperty('--card-color', `rgb(${r}, ${g}, ${b})`);
                card.style.setProperty('--card-border', `rgba(${r}, ${g}, ${b}, 0.6)`);
                card.style.setProperty('--card-shadow', `rgba(${r}, ${g}, ${b}, 0.2)`);
                card.style.setProperty('--card-shadow-hover', `rgba(${r}, ${g}, ${b}, 0.8)`);
                card.style.setProperty('--overlay-solid', `rgba(${Math.floor(r*0.15)}, ${Math.floor(g*0.15)}, ${Math.floor(b*0.15)}, 0.98)`);
                card.style.setProperty('--overlay-fade', `rgba(${Math.floor(r*0.15)}, ${Math.floor(g*0.15)}, ${Math.floor(b*0.15)}, 0.8)`);
            } catch(e) {}
        };
        hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
    });
}
        
        function highlightChart(domId, index) {
            if(!allCharts[domId]) return;
            allCharts[domId].data.datasets.forEach((ds, i) => {
                if (i !== index) { ds.backgroundColor = 'transparent'; ds.borderColor = 'rgba(255,255,255,0.05)'; ds.borderWidth = 1; }
                else { ds.backgroundColor = radarColors[i].border + '40'; ds.borderColor = radarColors[i].border; ds.borderWidth = 4; }
            });
            allCharts[domId].update();
        }

        function resetChart(domId) {
            if(!allCharts[domId]) return;
            allCharts[domId].data.datasets.forEach((ds, i) => { ds.backgroundColor = radarColors[i].bg; ds.borderColor = radarColors[i].border; ds.borderWidth = 2; });
            allCharts[domId].update();
        }

        initApp();
    </script>
</body>
</html>
